<!DOCTYPE html>
<html>
<head>
<title>My Website</title>
<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
  background-color: #f4f4f4;
}

header {
  background-color: #333;
  color: #fff;
  padding: 1em 0;
  text-align: center;
}

nav {
  background-color: #444;
  overflow: hidden;
}

nav a {
  float: left;
  display: block;
  color: white;
  text-align: center;
  padding: 14px 16px;
  text-decoration: none;
}

nav a:hover {
  background-color: #ddd;
  color: black;
}

main {
  padding: 20px;
}

section {
  margin-bottom: 20px;
  background-color: #fff;
  padding: 15px;
  border-radius: 5px;
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

footer {
  text-align: center;
  padding: 1em 0;
  background-color: #333;
  color: #fff;
  position: fixed;
  bottom: 0;
  width: 100%;
}

button {
  background-color: #4CAF50;
  color: white;
  padding: 10px 20px;
  border: none;
  cursor: pointer;
  border-radius: 5px;
}

button:hover {
  background-color: #3e8e41;
}

#imageContainer {
  display: flex;
  justify-content: center;
  margin-bottom: 20px;
}

#imageContainer img {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
}
</style>
</head>
<body>

<header>
  <h1>Welcome to My Website</h1>
</header>

<nav>
  <a href="#">Home</a>
  <a href="#">About</a>
  <a href="#">Services</a>
  <a href="#">Contact</a>
</nav>

<main>

  <section id="home">
    <h2>Home</h2>
    <p>This is the home page content. Welcome!</p>
    <div id="imageContainer">
      <img src="https://via.placeholder.com/600x400" alt="Placeholder Image">
    </div>

  </section>

  <section id="about">
    <h2>About Us</h2>
    <p>Learn more about our company here.</p>
  </section>

  <section id="services">
    <h2>Our Services</h2>
    <ul>
      <li>Service 1</li>
      <li>Service 2</li>
      <li>Service 3</li>
    </ul>
  </section>
  <button onclick="showAlert()">Click Me!</button>

</main>

<footer>
  <p>&copy; 2024 My Website. All rights reserved.</p>
</footer>

<script>
function showAlert() {
  alert("Button Clicked!");
}
</script>

</body>
</html>
