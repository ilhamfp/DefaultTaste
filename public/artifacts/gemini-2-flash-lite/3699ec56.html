<!DOCTYPE html>
<html>
<head>
<title>My Website</title>
<style>
body {
  font-family: sans-serif;
  margin: 0;
  padding: 0;
  background-color: #f0f0f0;
}

header {
  background-color: #333;
  color: white;
  padding: 1em;
  text-align: center;
}

nav {
  background-color: #444;
  padding: 0.5em;
}

nav ul {
  list-style: none;
  padding: 0;
  margin: 0;
  text-align: center;
}

nav li {
  display: inline-block;
  margin: 0 1em;
}

nav a {
  color: white;
  text-decoration: none;
}

main {
  padding: 1em;
  max-width: 800px;
  margin: 0 auto;
  background-color: white;
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

section {
  margin-bottom: 1em;
}

footer {
  background-color: #333;
  color: white;
  text-align: center;
  padding: 1em;
  position: relative;
  bottom: 0;
  width: 100%;
}

button {
  background-color: #007bff;
  color: white;
  padding: 0.5em 1em;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

button:hover {
  background-color: #0056b3;
}

#dynamicContent {
  margin-top: 1em;
  border: 1px solid #ccc;
  padding: 1em;
}
</style>
</head>
<body>

<header>
  <h1>Welcome to My Website</h1>
</header>

<nav>
  <ul>
    <li><a href="#">Home</a></li>
    <li><a href="#">About</a></li>
    <li><a href="#">Services</a></li>
    <li><a href="#">Contact</a></li>
  </ul>
</nav>

<main>
  <section>
    <h2>About Us</h2>
    <p>This is a sample website.  You can add your content here.</p>
  </section>

  <section>
    <h2>Services</h2>
    <p>We offer a range of services...</p>
  </section>

  <section>
    <h2>Contact Us</h2>
    <p>Contact information goes here.</p>
  </section>

  <section>
    <h2>Dynamic Content</h2>
    <button onclick="changeContent()">Change Content</button>
    <div id="dynamicContent">
      <p>Initial content.</p>
    </div>
  </section>
</main>

<footer>
  <p>&copy; 2024 My Website. All rights reserved.</p>
</footer>

<script>
function changeContent() {
  const dynamicDiv = document.getElementById("dynamicContent");
  dynamicDiv.innerHTML = "<p>Content changed by JavaScript!</p>";
}
</script>

</body>
</html>
