<!DOCTYPE html>
<html>
<head>
<title>My Website</title>
<style>
body {
  font-family: sans-serif;
  margin: 0;
  padding: 0;
  background-color: #f0f0f0;
}

header {
  background-color: #333;
  color: white;
  padding: 1em;
  text-align: center;
}

nav {
  background-color: #444;
  padding: 0.5em;
}

nav ul {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  justify-content: center;
}

nav li {
  margin: 0 1em;
}

nav a {
  color: white;
  text-decoration: none;
}

main {
  padding: 1em;
  text-align: center;
}

.content-box {
    background-color: #fff;
    border-radius: 5px;
    padding: 1em;
    margin-bottom: 1em;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

footer {
  background-color: #333;
  color: white;
  text-align: center;
  padding: 1em;
  position: fixed;
  bottom: 0;
  width: 100%;
}

button {
  background-color: #4CAF50;
  border: none;
  color: white;
  padding: 10px 20px;
  text-align: center;
  text-decoration: none;
  display: inline-block;
  font-size: 16px;
  margin: 4px 2px;
  cursor: pointer;
  border-radius: 5px;
}
</style>
</head>
<body>

<header>
  <h1>Welcome to My Website</h1>
</header>

<nav>
  <ul>
    <li><a href="#">Home</a></li>
    <li><a href="#">About</a></li>
    <li><a href="#">Services</a></li>
    <li><a href="#">Contact</a></li>
  </ul>
</nav>

<main>
    <div class="content-box">
        <h2>About Us</h2>
        <p>This is a sample website.  Learn more below.</p>
    </div>

    <div class="content-box">
        <h2>Our Services</h2>
        <p>We offer a variety of great services.  Please contact us with any questions.</p>
    </div>

    <button onclick="showAlert()">Click Me</button>

</main>

<footer>
  <p>&copy; 2024 My Website. All rights reserved.</p>
</footer>

<script>
function showAlert() {
  alert("Button Clicked!");
}
</script>

</body>
</html>
