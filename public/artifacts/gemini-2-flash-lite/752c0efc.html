<!DOCTYPE html>
<html>
<head>
<title>My Awesome Website</title>
<style>
body {
  font-family: sans-serif;
  margin: 0;
  padding: 0;
  background-color: #f0f0f0;
}

header {
  background-color: #333;
  color: white;
  text-align: center;
  padding: 1em 0;
}

nav {
  background-color: #444;
  color: white;
  padding: 0.5em 0;
  text-align: center;
}

nav a {
  color: white;
  text-decoration: none;
  padding: 0 1em;
}

main {
  padding: 2em;
  text-align: center;
}

.card {
  background-color: white;
  border-radius: 8px;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
  padding: 1em;
  margin-bottom: 2em;
}

button {
  background-color: #008CBA;
  color: white;
  padding: 10px 20px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}

footer {
  background-color: #333;
  color: white;
  text-align: center;
  padding: 1em 0;
  position: fixed;
  bottom: 0;
  width: 100%;
}
</style>
</head>
<body>

<header>
  <h1>Welcome to My Website!</h1>
</header>

<nav>
  <a href="#">Home</a>
  <a href="#">About</a>
  <a href="#">Services</a>
  <a href="#">Contact</a>
</nav>

<main>
  <div class="card">
    <h2>About Us</h2>
    <p>We are a company dedicated to providing awesome services.</p>
  </div>

  <div class="card">
    <h2>Our Services</h2>
    <ul>
      <li>Web Design</li>
      <li>Web Development</li>
      <li>SEO Optimization</li>
    </ul>
  </div>

  <button onclick="showAlert()">Click Me!</button>

</main>

<footer>
  <p>&copy; 2024 My Website. All rights reserved.</p>
</footer>

<script>
function showAlert() {
  alert("Button Clicked!");
}
</script>

</body>
</html>
