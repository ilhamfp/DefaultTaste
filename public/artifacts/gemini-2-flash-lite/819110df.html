<!DOCTYPE html>
<html>
<head>
<title>My Website</title>
<style>
body {
  font-family: sans-serif;
  margin: 0;
  padding: 0;
  background-color: #f0f0f0;
}

header {
  background-color: #333;
  color: white;
  padding: 1em;
  text-align: center;
}

nav {
  background-color: #444;
  padding: 0.5em;
}

nav ul {
  list-style: none;
  padding: 0;
  margin: 0;
  text-align: center;
}

nav li {
  display: inline;
  margin: 0 1em;
}

nav a {
  color: white;
  text-decoration: none;
}

main {
  padding: 1em;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
}

.card {
  background-color: white;
  border-radius: 8px;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
  padding: 1em;
  margin: 1em;
  width: 300px;
  text-align: center;
}

.card img {
  max-width: 100%;
  height: auto;
  border-radius: 4px;
  margin-bottom: 0.5em;
}

footer {
  background-color: #333;
  color: white;
  text-align: center;
  padding: 1em;
  position: fixed;
  bottom: 0;
  width: 100%;
}
</style>
</head>
<body>

<header>
  <h1>Welcome to My Website</h1>
</header>

<nav>
  <ul>
    <li><a href="#">Home</a></li>
    <li><a href="#">About</a></li>
    <li><a href="#">Services</a></li>
    <li><a href="#">Contact</a></li>
  </ul>
</nav>

<main>
  <div class="card">
    <img src="https://via.placeholder.com/300x200" alt="Placeholder Image">
    <h2>Card 1</h2>
    <p>This is the content of card 1.</p>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/300x200" alt="Placeholder Image">
    <h2>Card 2</h2>
    <p>This is the content of card 2.</p>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/300x200" alt="Placeholder Image">
    <h2>Card 3</h2>
    <p>This is the content of card 3.</p>
  </div>
</main>

<footer>
  <p>&copy; 2024 My Website</p>
</footer>

<script>
// JavaScript code (optional - does nothing in this example)

</script>

</body>
</html>
