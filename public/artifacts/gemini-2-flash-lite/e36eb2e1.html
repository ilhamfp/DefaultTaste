<!DOCTYPE html>
<html>
<head>
<title>My Website</title>
<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
  background-color: #f4f4f4;
}

header {
  background-color: #333;
  color: #fff;
  padding: 1em;
  text-align: center;
}

nav {
  background-color: #444;
  padding: 0.5em;
  text-align: center;
}

nav a {
  color: #fff;
  text-decoration: none;
  padding: 1em;
  display: inline-block;
}

main {
  padding: 1em;
  max-width: 800px;
  margin: 0 auto;
  background-color: #fff;
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

section {
  margin-bottom: 1em;
}


footer {
  background-color: #333;
  color: #fff;
  text-align: center;
  padding: 1em;
  position: fixed;
  bottom: 0;
  width: 100%;
}

button {
  background-color: #4CAF50;
  border: none;
  color: white;
  padding: 10px 20px;
  text-align: center;
  text-decoration: none;
  display: inline-block;
  font-size: 16px;
  margin: 4px 2px;
  cursor: pointer;
  border-radius: 5px;
}
#dynamicContent {
  padding: 1em;
  border: 1px solid #ccc;
  margin-top: 1em;
}
</style>
</head>
<body>

<header>
  <h1>Welcome to My Website</h1>
</header>

<nav>
  <a href="#">Home</a>
  <a href="#">About</a>
  <a href="#">Services</a>
  <a href="#">Contact</a>
</nav>

<main>
  <section>
    <h2>Introduction</h2>
    <p>This is a basic website created with HTML, CSS, and JavaScript.</p>
  </section>

  <section>
    <h2>Example Content</h2>
    <p>Feel free to explore the different sections of this website.</p>
  </section>

  <button onclick="changeContent()">Click Me</button>
  <div id="dynamicContent">
    This content will be dynamically updated.
  </div>
</main>

<footer>
  <p>&copy; 2024 My Website. All rights reserved.</p>
</footer>

<script>
function changeContent() {
  document.getElementById("dynamicContent").innerHTML = "Content changed by JavaScript!";
}
</script>

</body>
</html>
