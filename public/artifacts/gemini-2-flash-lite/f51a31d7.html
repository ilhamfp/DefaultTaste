<!DOCTYPE html>
<html>
<head>
<title>My Website</title>
<style>
body {
  font-family: sans-serif;
  margin: 0;
  padding: 0;
  background-color: #f0f0f0;
}

header {
  background-color: #333;
  color: white;
  padding: 1em;
  text-align: center;
}

nav {
  background-color: #444;
  color: white;
  padding: 0.5em;
  text-align: center;
}

nav a {
  color: white;
  text-decoration: none;
  padding: 0.5em 1em;
}

section {
  padding: 2em;
  background-color: white;
  margin: 1em;
  border-radius: 5px;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
}

footer {
  background-color: #333;
  color: white;
  text-align: center;
  padding: 1em;
  position: fixed;
  bottom: 0;
  width: 100%;
}

button {
  background-color: #4CAF50;
  color: white;
  padding: 10px 20px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

button:hover {
  background-color: #3e8e41;
}

#imageContainer {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 20px;
}

#myImage {
    max-width: 100%;
    max-height: 200px;
    border-radius: 10px;
}
</style>
</head>
<body>

<header>
  <h1>Welcome to My Website</h1>
</header>

<nav>
  <a href="#">Home</a>
  <a href="#">About</a>
  <a href="#">Contact</a>
</nav>

<section>
  <h2>About Us</h2>
  <p>This is a sample website built with HTML, CSS, and JavaScript. It demonstrates basic structure and functionality.</p>

  <div id="imageContainer">
      <img id="myImage" src="https://via.placeholder.com/300x200" alt="Placeholder Image">
  </div>

  <button onclick="changeImage()">Change Image</button>

</section>

<section>
  <h2>Contact Us</h2>
  <p>Feel free to reach out to us!</p>
</section>

<footer>
  &copy; 2024 My Website. All rights reserved.
</footer>

<script>
function changeImage() {
  const image = document.getElementById('myImage');
  const imageUrls = [
      "https://via.placeholder.com/300x200/FF0000/FFFFFF",
      "https://via.placeholder.com/300x200/00FF00/000000",
      "https://via.placeholder.com/300x200/0000FF/FFFFFF"
  ];
  const randomIndex = Math.floor(Math.random() * imageUrls.length);
  image.src = imageUrls[randomIndex];
}
</script>

</body>
</html>
