<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Personal Portfolio</title>
    <style>
        :root {
            --bg: #f4f4f9;
            --text: #333;
            --accent: #6366f1;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            line-height: 1.6;
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 2rem;
        }
        .container {
            max-width: 600px;
            background: white;
            padding: 3rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        h1 { color: var(--accent); margin-top: 0; }
        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 1rem;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        #message { margin-top: 1.5rem; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Hello, World!</h1>
        <p>Welcome to my self-contained web page. Everything you see here is bundled into a single file.</p>
        <button id="actionBtn">Click for a surprise</button>
        <div id="message"></div>
    </div>

    <script>
        const btn = document.getElementById('actionBtn');
        const msg = document.getElementById('message');
        
        btn.addEventListener('click', () => {
            const colors = ['#ef4444', '#22c55e', '#3b82f6', '#eab308'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            
            msg.textContent = "You've successfully triggered the JavaScript!";
            msg.style.color = randomColor;
            btn.textContent = "Clicked!";
            btn.style.backgroundColor = randomColor;
        });
    </script>
</body>
</html>
