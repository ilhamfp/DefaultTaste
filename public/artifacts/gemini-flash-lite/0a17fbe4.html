<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Minimalist Portal</title>
    <style>
        :root {
            --bg: #0f172a;
            --text: #f8fafc;
            --accent: #38bdf8;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 2rem;
        }
        h1 { font-size: 3rem; margin-bottom: 0.5rem; color: var(--accent); }
        p { font-size: 1.2rem; opacity: 0.8; margin-bottom: 2rem; }
        button {
            padding: 1rem 2rem;
            font-size: 1rem;
            background: transparent;
            color: var(--accent);
            border: 2px solid var(--accent);
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        button:hover {
            background: var(--accent);
            color: var(--bg);
        }
        #box {
            margin-top: 2rem;
            width: 100px;
            height: 100px;
            background: var(--accent);
            margin-left: auto;
            margin-right: auto;
            border-radius: 20px;
            transition: transform 0.5s;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome.</h1>
        <p>This is a self-contained web experience. Press the button to trigger the interaction.</p>
        <button id="actionBtn">Transform Box</button>
        <div id="box"></div>
    </div>

    <script>
        const btn = document.getElementById('actionBtn');
        const box = document.getElementById('box');
        let rotated = false;

        btn.addEventListener('click', () => {
            rotated = !rotated;
            box.style.transform = rotated ? 'rotate(45deg) scale(1.5)' : 'rotate(0deg) scale(1)';
            box.style.borderRadius = rotated ? '50%' : '20px';
        });
    </script>
</body>
</html>
