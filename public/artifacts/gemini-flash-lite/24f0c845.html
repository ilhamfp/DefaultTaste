<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Portfolio</title>
    <style>
        :root {
            --bg: #f4f4f9;
            --text: #333;
            --accent: #4a90e2;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            padding: 4rem 1rem;
            text-align: center;
        }
        main {
            max-width: 800px;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }
        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        button:hover { opacity: 0.9; }
        footer { margin-top: auto; padding: 20px; font-size: 0.9rem; }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Site</h1>
        <p>Built with pure HTML, CSS, and JS</p>
    </header>

    <main>
        <section class="card">
            <h2>About Me</h2>
            <p>I am a web developer creating clean and efficient digital experiences. Click the button below to see a small interaction.</p>
            <button id="actionBtn">Click to greet me</button>
            <p id="msg" style="margin-top: 15px; font-weight: bold;"></p>
        </section>
    </main>

    <footer>
        &copy; 2023 Simple Web Project
    </footer>

    <script>
        const btn = document.getElementById('actionBtn');
        const msg = document.getElementById('msg');

        btn.addEventListener('click', () => {
            msg.textContent = "Hello! Thanks for visiting!";
            btn.style.backgroundColor = "#27ae60";
            setTimeout(() => {
                msg.textContent = "";
                btn.style.backgroundColor = "#4a90e2";
            }, 3000);
        });
    </script>
</body>
</html>
