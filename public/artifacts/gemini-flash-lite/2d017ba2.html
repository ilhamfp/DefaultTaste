<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Minimalist Dashboard</title>
    <style>
        :root {
            --bg: #f0f2f5;
            --card: #ffffff;
            --primary: #4a90e2;
            --text: #333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            width: 100%;
            padding: 2rem;
            text-align: center;
            background: var(--primary);
            color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        main {
            padding: 2rem;
            width: 90%;
            max-width: 800px;
        }
        .card {
            background: var(--card);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
        }
        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.05);
        }
        #clock {
            font-size: 2rem;
            font-weight: bold;
            margin: 1rem 0;
            color: var(--primary);
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Dashboard</h1>
    </header>

    <main>
        <div class="card">
            <h2>Current Time</h2>
            <div id="clock">00:00:00</div>
            <p>Click the button below to change the theme color!</p>
            <button onclick="changeColor()">Change Accent Color</button>
        </div>
    </main>

    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString();
        }
        setInterval(updateClock, 1000);
        updateClock();

        function changeColor() {
            const randomColor = '#' + Math.floor(Math.random()*16777215).toString(16);
            document.documentElement.style.setProperty('--primary', randomColor);
            document.querySelector('header').style.backgroundColor = randomColor;
        }
    </script>
</body>
</html>
