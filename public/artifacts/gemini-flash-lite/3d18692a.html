<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Portfolio</title>
    <style>
        :root {
            --bg: #f4f4f9;
            --text: #333;
            --accent: #6366f1;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            padding: 4rem 1rem;
            text-align: center;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 600px;
            margin: 1rem;
        }
        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        #message {
            margin-top: 1rem;
            font-weight: bold;
            color: var(--accent);
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Space</h1>
        <p>Building things for the web, one line at a time.</p>
    </header>

    <main class="card">
        <h2>About Me</h2>
        <p>I am a passionate developer who loves creating clean, functional, and user-friendly interfaces. This page is a simple demonstration of what can be built with just a single HTML file.</p>
        <button id="actionBtn">Click for a surprise</button>
        <p id="message"></p>
    </main>

    <script>
        const btn = document.getElementById('actionBtn');
        const msg = document.getElementById('message');

        btn.addEventListener('click', () => {
            const greetings = [
                "Hello there! Have a great day!",
                "Keep coding and stay curious!",
                "You just triggered some JavaScript magic!",
                "Frontend development is awesome!"
            ];
            const randomMsg = greetings[Math.floor(Math.random() * greetings.length)];
            msg.textContent = randomMsg;
        });
    </script>
</body>
</html>
