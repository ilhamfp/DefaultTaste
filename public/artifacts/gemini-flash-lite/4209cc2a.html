<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Minimalist Portfolio</title>
    <style>
        :root {
            --bg: #0f172a;
            --text: #f8fafc;
            --accent: #38bdf8;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 2rem;
        }
        h1 { font-size: 3rem; margin-bottom: 0.5rem; }
        p { color: #94a3b8; margin-bottom: 2rem; }
        button {
            background-color: var(--accent);
            color: #000;
            border: none;
            padding: 1rem 2rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        button:hover { transform: scale(1.05); background: #7dd3fc; }
        #message { margin-top: 2rem; font-style: italic; color: var(--accent); }
    </style>
</head>
<body>

    <div class="container">
        <h1>Hello World</h1>
        <p>I am a web developer building things for the modern web. Welcome to my interactive landing page.</p>
        <button id="actionBtn">Click for a Surprise</button>
        <div id="message"></div>
    </div>

    <script>
        const btn = document.getElementById('actionBtn');
        const msg = document.getElementById('message');
        
        btn.addEventListener('click', () => {
            const messages = [
                "Keep coding! 🚀",
                "The web is your canvas. 🎨",
                "Great things take time. ⏳",
                "You just executed JavaScript! ⚡"
            ];
            const randomMsg = messages[Math.floor(Math.random() * messages.length)];
            msg.textContent = randomMsg;
            btn.style.backgroundColor = "#fbbf24";
        });
    </script>
</body>
</html>
