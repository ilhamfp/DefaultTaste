<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Personal Portfolio</title>
    <style>
        :root {
            --bg: #f4f4f9;
            --text: #333;
            --accent: #4a90e2;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            padding: 4rem 1rem;
            text-align: center;
        }
        .container {
            max-width: 800px;
            width: 90%;
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 1rem;
        }
        button:hover { background: #357abd; }
        #message { margin-top: 1rem; font-weight: bold; color: var(--accent); }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Website</h1>
        <p>Built with pure HTML, CSS, and JS</p>
    </header>

    <div class="container">
        <h2>About</h2>
        <p>This is a self-contained web page. Everything you see here is bundled into a single file for easy portability and deployment.</p>
        
        <h2>Interaction</h2>
        <p>Click the button below to see a simple JavaScript demonstration:</p>
        <button id="actionBtn">Click Me</button>
        <p id="message"></p>
    </div>

    <script>
        const btn = document.getElementById('actionBtn');
        const msg = document.getElementById('message');

        btn.addEventListener('click', () => {
            const time = new Date().toLocaleTimeString();
            msg.textContent = `Button clicked at ${time}! This is a dynamic update.`;
        });
    </script>

</body>
</html>
