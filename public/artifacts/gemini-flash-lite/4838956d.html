<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Personal Space</title>
    <style>
        :root {
            --bg: #f4f4f9;
            --text: #333;
            --accent: #6366f1;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: white;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        h1 { margin-bottom: 0.5rem; color: var(--accent); }
        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 20px;
            transition: transform 0.2s;
        }
        button:hover { transform: scale(1.05); }
        #date { margin-top: 15px; font-style: italic; color: #888; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome</h1>
        <p>This is a self-contained, lightweight web page.</p>
        <div id="date"></div>
        <button onclick="changeText()">Interact</button>
    </div>

    <script>
        document.getElementById('date').innerText = "Today is " + new Date().toLocaleDateString();
        
        function changeText() {
            const h1 = document.querySelector('h1');
            h1.innerText = "Hello, Developer!";
            h1.style.color = "#ec4899";
        }
    </script>
</body>
</html>
