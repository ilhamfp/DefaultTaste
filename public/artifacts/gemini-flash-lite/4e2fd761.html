<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Minimalist Page</title>
    <style>
        :root {
            --bg: #0f172a;
            --text: #f8fafc;
            --accent: #38bdf8;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            padding: 2rem;
            max-width: 600px;
        }
        h1 { font-size: 3rem; margin-bottom: 1rem; }
        button {
            background-color: var(--accent);
            color: var(--bg);
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }
        button:hover { opacity: 0.9; transform: scale(1.05); }
        #message { margin-top: 20px; font-style: italic; color: var(--accent); }
    </style>
</head>
<body>

    <div class="container">
        <h1>Hello, World.</h1>
        <p>This is a self-contained, single-file web application generated just for you.</p>
        <button id="actionBtn">Click for Magic</button>
        <div id="message"></div>
    </div>

    <script>
        const btn = document.getElementById('actionBtn');
        const msg = document.getElementById('message');
        const messages = [
            "You just sparked a function!",
            "The browser is listening.",
            "Keep building amazing things.",
            "JavaScript is running perfectly."
        ];

        btn.addEventListener('click', () => {
            const random = messages[Math.floor(Math.random() * messages.length)];
            msg.textContent = random;
            btn.style.backgroundColor = btn.style.backgroundColor === 'white' ? '#38bdf8' : 'white';
        });
    </script>

</body>
</html>
