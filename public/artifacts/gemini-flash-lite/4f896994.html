<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Portfolio</title>
    <style>
        :root {
            --bg: #f4f4f9;
            --text: #333;
            --accent: #6366f1;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            padding: 4rem 1rem;
            text-align: center;
        }
        .container {
            max-width: 800px;
            width: 90%;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }
        button {
            padding: 0.8rem 1.5rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { opacity: 0.9; }
        footer { margin-top: 2rem; font-size: 0.9rem; color: #666; }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Space</h1>
        <p>A simple, clean, and responsive landing page.</p>
    </header>

    <div class="container">
        <div class="card">
            <h2>About Me</h2>
            <p>I am a developer who loves building things for the web. This page demonstrates how a single HTML file can contain structure, style, and logic.</p>
            <button id="actionBtn">Click for a surprise</button>
            <p id="message" style="margin-top: 1rem; font-weight: bold; color: var(--accent);"></p>
        </div>
    </div>

    <footer>
        &copy; 2023 Built with passion
    </footer>

    <script>
        const btn = document.getElementById('actionBtn');
        const msg = document.getElementById('message');

        btn.addEventListener('click', () => {
            msg.textContent = "Hello! Thanks for clicking the button.";
            btn.style.backgroundColor = "#4f46e5";
        });
    </script>
</body>
</html>
