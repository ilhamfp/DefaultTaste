<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Minimalist Portfolio</title>
    <style>
        :root {
            --bg: #0f172a;
            --text: #f8fafc;
            --accent: #38bdf8;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 2rem;
        }
        h1 { font-size: 3rem; margin-bottom: 0.5rem; }
        p { color: #94a3b8; margin-bottom: 2rem; }
        button {
            padding: 0.8rem 2rem;
            background: var(--accent);
            border: none;
            border-radius: 50px;
            color: var(--bg);
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px var(--accent);
        }
        #message {
            margin-top: 2rem;
            font-weight: bold;
            color: var(--accent);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome.</h1>
        <p>I am a web developer building the future, one line of code at a time. Click the button below to see something cool.</p>
        <button id="actionBtn">Click Me</button>
        <div id="message"></div>
    </div>

    <script>
        const btn = document.getElementById('actionBtn');
        const msg = document.getElementById('message');
        const phrases = [
            "Hello World! 🚀",
            "Code is poetry.",
            "Function executed successfully.",
            "Binary is beautiful.",
            "Keep building amazing things."
        ];

        btn.addEventListener('click', () => {
            const randomPhrase = phrases[Math.floor(Math.random() * phrases.length)];
            msg.innerText = randomPhrase;
            btn.style.backgroundColor = btn.style.backgroundColor === 'white' ? '#38bdf8' : 'white';
        });
    </script>
</body>
</html>
