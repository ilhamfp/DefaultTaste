<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Portfolio</title>
    <style>
        :root {
            --bg: #f4f4f9;
            --text: #333;
            --accent: #6366f1;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        nav {
            padding: 2rem;
            width: 100%;
            text-align: center;
        }
        .container {
            max-width: 800px;
            padding: 2rem;
        }
        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: opacity 0.3s;
        }
        button:hover {
            opacity: 0.9;
        }
        #message {
            margin-top: 20px;
            font-weight: bold;
            color: var(--accent);
        }
    </style>
</head>
<body>

    <nav>
        <h1>My Web Space</h1>
    </nav>

    <div class="container">
        <h2>Welcome to my site</h2>
        <p>This is a single-file template created with HTML, CSS, and JS. It is clean, lightweight, and ready for customization.</p>
        
        <button id="actionBtn">Click to Interact</button>
        <p id="message"></p>
    </div>

    <script>
        const btn = document.getElementById('actionBtn');
        const msg = document.getElementById('message');

        btn.addEventListener('click', () => {
            const colors = ['#f16363', '#63f17a', '#639df1', '#f163e8'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            
            msg.textContent = "Great job! You interacted with the page.";
            document.body.style.backgroundColor = randomColor;
            btn.textContent = "Change Color Again";
        });
    </script>
</body>
</html>
