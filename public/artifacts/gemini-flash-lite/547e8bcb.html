<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Portfolio</title>
    <style>
        :root {
            --bg: #f4f4f9;
            --text: #333;
            --accent: #6366f1;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        nav {
            padding: 2rem;
            width: 100%;
            text-align: center;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .container {
            max-width: 800px;
            padding: 2rem;
        }
        h1 { color: var(--accent); }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            margin-top: 2rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: opacity 0.3s;
        }
        button:hover { opacity: 0.9; }
        #message { margin-top: 1rem; font-weight: bold; }
    </style>
</head>
<body>

    <nav>
        <h1>My Personal Webpage</h1>
    </nav>

    <div class="container">
        <div class="card">
            <h2>Welcome</h2>
            <p>This is a single-file template created for you. It's responsive, clean, and uses vanilla HTML, CSS, and JS.</p>
            <button id="actionBtn">Click for Surprise</button>
            <p id="message"></p>
        </div>
    </div>

    <script>
        const btn = document.getElementById('actionBtn');
        const msg = document.getElementById('message');

        btn.addEventListener('click', () => {
            const colors = ['#6366f1', '#f59e0b', '#10b981', '#ef4444'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            
            document.querySelector('h1').style.color = randomColor;
            msg.textContent = "You clicked the button! The heading color changed.";
            btn.style.backgroundColor = randomColor;
        });
    </script>
</body>
</html>
