<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Portfolio Page</title>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --text: #f8fafc;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            padding: 4rem 1rem;
            text-align: center;
        }
        .container {
            max-width: 800px;
            width: 90%;
        }
        .card {
            background: #1e293b;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
            transition: transform 0.3s ease;
        }
        .card:hover { transform: translateY(-5px); }
        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: bold;
        }
        footer { margin-top: auto; padding: 2rem; opacity: 0.6; }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Workspace</h1>
        <p>Built with pure HTML, CSS, and JS</p>
    </header>

    <main class="container">
        <div class="card" id="interactive-card">
            <h2>Interactive Element</h2>
            <p id="counter-text">Clicked 0 times.</p>
            <button onclick="incrementCounter()">Click Me!</button>
        </div>

        <div class="card">
            <h2>About This Page</h2>
            <p>This is a self-contained single file solution. It renders instantly without dependencies, external assets, or build tools.</p>
        </div>
    </main>

    <footer>
        &copy; 2023 Web Developer Tools
    </footer>

    <script>
        let count = 0;
        function incrementCounter() {
            count++;
            const text = document.getElementById('counter-text');
            text.innerText = `Clicked ${count} time${count > 1 ? 's' : ''}.`;
            text.style.color = count % 5 === 0 ? '#fbbf24' : '#f8fafc';
        }
    </script>
</body>
</html>
