<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Minimalist Portfolio</title>
    <style>
        :root {
            --bg: #0f172a;
            --text: #f8fafc;
            --accent: #38bdf8;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 600px;
            padding: 2rem;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 2rem;
        }

        button {
            padding: 1rem 2rem;
            font-size: 1rem;
            background: var(--accent);
            border: none;
            border-radius: 8px;
            color: var(--bg);
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        #message {
            margin-top: 2rem;
            font-style: italic;
            height: 1.5rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Hello, World!</h1>
        <p>This is a self-contained single-page application generated for you.</p>
        <button id="actionBtn">Click for a surprise</button>
        <div id="message"></div>
    </div>

    <script>
        const btn = document.getElementById('actionBtn');
        const message = document.getElementById('message');

        btn.addEventListener('click', () => {
            const colors = ['#f87171', '#fbbf24', '#34d399', '#818cf8', '#f472b6'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            
            message.innerText = "You just triggered a JavaScript event!";
            message.style.color = randomColor;
            
            btn.style.backgroundColor = randomColor;
            
            console.log("Button clicked!");
        });
    </script>
</body>
</html>
