<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Personal Portfolio</title>
    <style>
        :root {
            --bg: #f4f4f9;
            --text: #333;
            --accent: #6366f1;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            padding: 4rem 1rem;
            text-align: center;
        }
        .container {
            max-width: 800px;
            padding: 2rem;
            background: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 1rem;
        }
        button:hover { opacity: 0.9; }
        #date-display { margin-top: 1rem; font-weight: bold; color: var(--accent); }
    </style>
</head>
<body>

<header>
    <h1>Welcome to My Website</h1>
    <p>Elegant, simple, and functional.</p>
</header>

<div class="container">
    <h2>Projects</h2>
    <p>This is a self-contained HTML page generated for demonstration purposes. It includes basic interactivity and styling.</p>
    
    <button id="actionBtn">Click for Current Time</button>
    <div id="date-display"></div>
</div>

<script>
    const btn = document.getElementById('actionBtn');
    const display = document.getElementById('date-display');

    btn.addEventListener('click', () => {
        const now = new Date();
        display.textContent = `Current time: ${now.toLocaleTimeString()}`;
    });
</script>

</body>
</html>
