<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Portfolio</title>
    <style>
        :root {
            --bg: #f4f4f9;
            --text: #333;
            --accent: #6366f1;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        nav {
            padding: 2rem;
            width: 100%;
            text-align: center;
        }
        section {
            max-width: 800px;
            padding: 2rem;
        }
        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: opacity 0.3s;
        }
        button:hover {
            opacity: 0.9;
        }
        #message {
            margin-top: 1rem;
            font-weight: bold;
            color: var(--accent);
        }
    </style>
</head>
<body>

    <nav>
        <h1>Welcome to My Site</h1>
    </nav>

    <section>
        <h2>About Me</h2>
        <p>I am a web developer passionate about creating clean, functional, and user-friendly web experiences. This page is built as a single, self-contained HTML file.</p>
        <button id="actionBtn">Click for a surprise</button>
        <p id="message"></p>
    </section>

    <script>
        const btn = document.getElementById('actionBtn');
        const msg = document.getElementById('message');

        btn.addEventListener('click', () => {
            const colors = ['#f16363', '#63f185', '#63b2f1', '#f163e9'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            document.body.style.backgroundColor = randomColor;
            msg.textContent = "Background color changed!";
            
            setTimeout(() => {
                document.body.style.backgroundColor = '#f4f4f9';
                msg.textContent = "";
            }, 2000);
        });
    </script>
</body>
</html>
