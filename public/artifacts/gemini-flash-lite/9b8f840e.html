<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Personal Dashboard</title>
    <style>
        :root {
            --bg: #0f172a;
            --text: #f8fafc;
            --accent: #38bdf8;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .container {
            text-align: center;
            padding: 2rem;
            border: 1px solid #334155;
            border-radius: 1rem;
            background: #1e293b;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
        }
        h1 { margin-bottom: 0.5rem; color: var(--accent); }
        #clock { font-size: 3rem; font-weight: bold; margin: 1rem 0; }
        button {
            padding: 0.75rem 1.5rem;
            background: var(--accent);
            border: none;
            border-radius: 0.5rem;
            color: var(--bg);
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover { transform: scale(1.05); }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome</h1>
        <div id="clock">00:00:00</div>
        <p id="date"></p>
        <button onclick="changeColor()">Change Theme Color</button>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString();
            document.getElementById('date').innerText = now.toDateString();
        }
        
        function changeColor() {
            const hue = Math.floor(Math.random() * 360);
            document.documentElement.style.setProperty('--accent', `hsl(${hue}, 70%, 60%)`);
        }

        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body>
</html>
