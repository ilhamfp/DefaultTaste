<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Minimalist Page</title>
    <style>
        :root {
            --bg: #0f172a;
            --text: #f8fafc;
            --accent: #38bdf8;
        }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 2rem;
        }
        h1 { font-size: 3rem; margin-bottom: 1rem; color: var(--accent); }
        button {
            background: var(--accent);
            color: var(--bg);
            border: none;
            padding: 1rem 2rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }
        button:hover { opacity: 0.9; transform: scale(1.05); }
        #message { margin-top: 2rem; font-style: italic; opacity: 0; transition: opacity 0.5s; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome.</h1>
        <p>This is a self-contained web page generated dynamically.</p>
        <button id="actionBtn">Click for a surprise</button>
        <p id="message">The web is a wonderful place to build!</p>
    </div>

    <script>
        const btn = document.getElementById('actionBtn');
        const msg = document.getElementById('message');

        btn.addEventListener('click', () => {
            msg.style.opacity = '1';
            btn.textContent = 'Clicked!';
            btn.style.backgroundColor = '#fbbf24';
        });
    </script>
</body>
</html>
