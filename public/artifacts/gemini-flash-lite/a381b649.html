<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Portfolio</title>
    <style>
        :root {
            --bg: #f4f4f9;
            --text: #333;
            --accent: #6366f1;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            padding: 4rem 1rem;
            text-align: center;
        }
        .container {
            max-width: 800px;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
        }
        button:hover { opacity: 0.9; }
        footer { margin-top: 50px; font-size: 0.8rem; color: #888; }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Site</h1>
        <p>Built with pure HTML, CSS, and JS.</p>
    </header>

    <div class="container">
        <section class="card" id="about">
            <h2>About</h2>
            <p>I am a web developer passionate about crafting clean, efficient, and user-friendly digital experiences. This site serves as a basic template for my projects.</p>
            <button id="actionBtn">Click for a Surprise</button>
            <p id="message" style="margin-top: 15px; font-weight: bold; color: var(--accent);"></p>
        </section>

        <section class="card">
            <h2>Current Status</h2>
            <p>System clock: <span id="clock"></span></p>
        </section>
    </div>

    <footer>
        &copy; 2023 Digital Portfolio Template
    </footer>

    <script>
        // Interaction
        const btn = document.getElementById('actionBtn');
        const message = document.getElementById('message');
        
        btn.addEventListener('click', () => {
            message.textContent = "Hello! Thanks for clicking the button.";
            btn.style.display = 'none';
        });

        // Clock Script
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString();
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
