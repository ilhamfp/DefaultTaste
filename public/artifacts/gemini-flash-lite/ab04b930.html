<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Portfolio</title>
    <style>
        :root {
            --bg: #f4f4f9;
            --text: #333;
            --accent: #6366f1;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            padding: 4rem 1rem;
            text-align: center;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 90%;
            margin-bottom: 2rem;
        }
        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: opacity 0.3s;
        }
        button:hover {
            opacity: 0.9;
        }
        #message {
            margin-top: 1rem;
            font-weight: bold;
            color: var(--accent);
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Space</h1>
        <p>Built with pure HTML, CSS, and JS.</p>
    </header>

    <div class="card">
        <h2>Interactive Section</h2>
        <p>Click the button below to see a simple JavaScript interaction in action.</p>
        <button id="actionBtn">Click Me</button>
        <p id="message"></p>
    </div>

    <script>
        const btn = document.getElementById('actionBtn');
        const message = document.getElementById('message');

        btn.addEventListener('click', () => {
            const colors = ['#6366f1', '#ec4899', '#10b981', '#f59e0b'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            
            message.innerText = "Hello! The button works perfectly.";
            message.style.color = randomColor;
            
            btn.style.backgroundColor = randomColor;
        });
    </script>
</body>
</html>
