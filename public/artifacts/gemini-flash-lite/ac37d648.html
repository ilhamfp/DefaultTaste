<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Portfolio</title>
    <style>
        :root {
            --bg: #f4f4f9;
            --text: #333;
            --accent: #6366f1;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            line-height: 1.6;
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            padding: 4rem 1rem;
            text-align: center;
        }
        .container {
            max-width: 800px;
            padding: 0 20px;
        }
        h1 { font-size: 3rem; margin-bottom: 0.5rem; }
        button {
            padding: 12px 24px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        #date-display { margin-top: 20px; font-weight: bold; color: var(--accent); }
        section {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Site</h1>
        <p>Built with pure HTML, CSS, and JS.</p>
        <button id="actionBtn">Click for Surprise</button>
        <div id="date-display"></div>
    </header>

    <div class="container">
        <section>
            <h2>About</h2>
            <p>This is a single-file template. No frameworks, no external dependencies, just clean code ready for your content.</p>
        </section>
        
        <section>
            <h2>Projects</h2>
            <p>Feature your work here. Everything is responsive and centered by default.</p>
        </section>
    </div>

    <script>
        const btn = document.getElementById('actionBtn');
        const display = document.getElementById('date-display');

        btn.addEventListener('click', () => {
            const now = new Date();
            display.textContent = `Today is ${now.toDateString()}`;
            btn.textContent = "Thanks for clicking!";
            btn.style.backgroundColor = "#22c55e";
        });
    </script>
</body>
</html>
