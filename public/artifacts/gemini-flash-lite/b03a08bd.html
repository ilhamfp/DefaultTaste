<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Portfolio</title>
    <style>
        :root {
            --bg: #f4f4f9;
            --text: #333;
            --accent: #4a90e2;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            padding: 4rem 1rem;
            text-align: center;
        }
        .container {
            max-width: 800px;
            padding: 2rem;
            background: #fff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-radius: 8px;
            margin-bottom: 2rem;
        }
        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            transition: opacity 0.3s;
        }
        button:hover {
            opacity: 0.8;
        }
        #message {
            margin-top: 1rem;
            font-weight: bold;
            color: var(--accent);
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Site</h1>
        <p>A simple, self-contained web experience.</p>
    </header>

    <div class="container">
        <h2>About This Page</h2>
        <p>This is a single-file HTML document. No external dependencies, no complex frameworks, just pure code running directly in your browser.</p>
        
        <h3>Interactive Element</h3>
        <button id="toggleBtn">Click to change state</button>
        <p id="message"></p>
    </div>

    <script>
        const btn = document.getElementById('toggleBtn');
        const msg = document.getElementById('message');
        let toggled = false;

        btn.addEventListener('click', () => {
            toggled = !toggled;
            if (toggled) {
                msg.textContent = "You've successfully triggered the JavaScript event!";
                btn.style.backgroundColor = "#e24a4a";
            } else {
                msg.textContent = "";
                btn.style.backgroundColor = "#4a90e2";
            }
        });
    </script>
</body>
</html>
