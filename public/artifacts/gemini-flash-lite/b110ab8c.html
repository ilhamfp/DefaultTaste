<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Personal Space</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            background: #2c3e50;
            color: #fff;
            padding: 2rem;
            width: 100%;
            text-align: center;
        }
        main {
            max-width: 800px;
            padding: 2rem;
        }
        .card {
            background: white;
            padding: 1.5rem;
            margin-bottom: 1rem;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        button {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
        }
        button:hover {
            background: #2980b9;
        }
        footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

<header>
    <h1>Welcome to My Website</h1>
    <p>Built with love, pure HTML, CSS, and JS</p>
</header>

<main>
    <div class="card">
        <h2>Interactive Section</h2>
        <p id="message">Click the button below to change this text.</p>
        <button id="actionBtn">Click Me</button>
    </div>

    <div class="card">
        <h2>About</h2>
        <p>This is a self-contained web page. Everything is bundled into one file for simplicity and portability.</p>
    </div>
</main>

<footer>
    &copy; 2023 Minimalist Web Developer
</footer>

<script>
    const btn = document.getElementById('actionBtn');
    const msg = document.getElementById('message');

    btn.addEventListener('click', () => {
        msg.textContent = "The website is alive! JavaScript is working perfectly.";
        msg.style.color = "#27ae60";
        msg.style.fontWeight = "bold";
        btn.style.display = "none";
    });
</script>

</body>
</html>
