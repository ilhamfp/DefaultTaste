<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Portfolio Page</title>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --text: #f8fafc;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        nav {
            padding: 2rem;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 2rem;
        }
        .hero {
            text-align: center;
            padding: 4rem 1rem;
        }
        h1 { font-size: 3rem; margin-bottom: 1rem; color: var(--primary); }
        button {
            padding: 0.8rem 1.5rem;
            background: var(--primary);
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }
        button:hover { transform: scale(1.05); }
        .card-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            padding: 2rem;
            max-width: 1000px;
        }
        .card {
            background: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            text-align: center;
        }
    </style>
</head>
<body>

    <nav>
        <a href="#" style="color:white; text-decoration:none">Home</a>
        <a href="#" style="color:white; text-decoration:none">About</a>
        <a href="#" style="color:white; text-decoration:none">Contact</a>
    </nav>

    <div class="hero">
        <h1>Welcome to My Website</h1>
        <p>Built with pure HTML, CSS, and JS.</p>
        <button id="actionBtn">Click for Interaction</button>
    </div>

    <div class="card-container">
        <div class="card"><h3>Design</h3><p>Creative UI/UX solutions.</p></div>
        <div class="card"><h3>Code</h3><p>Clean, efficient development.</p></div>
        <div class="card"><h3>Launch</h3><p>Bringing projects to life.</p></div>
    </div>

    <script>
        document.getElementById('actionBtn').addEventListener('click', () => {
            alert('Hello! Thanks for visiting my interactive site.');
            document.body.style.backgroundColor = '#1e1b4b';
        });
    </script>
</body>
</html>
