<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Portfolio</title>
    <style>
        :root {
            --bg: #f4f4f9;
            --text: #333;
            --accent: #6366f1;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            padding: 4rem 1rem;
            text-align: center;
        }
        .container {
            max-width: 800px;
            width: 90%;
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        #message {
            margin-top: 1rem;
            font-weight: bold;
            color: var(--accent);
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Website</h1>
        <p>Built with pure HTML, CSS, and JS</p>
    </header>

    <div class="container">
        <h2>About This Page</h2>
        <p>This is a complete, self-contained single-page website. You can use this as a boilerplate for your next project. Click the button below to see a simple JavaScript interaction.</p>
        
        <button id="actionBtn">Click for a surprise</button>
        <p id="message"></p>
    </div>

    <script>
        const btn = document.getElementById('actionBtn');
        const msg = document.getElementById('message');

        btn.addEventListener('click', () => {
            const colors = ['#f87171', '#fbbf24', '#34d399', '#60a5fa', '#a78bfa'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            
            msg.textContent = "Hello! Use this code to build something amazing!";
            document.body.style.backgroundColor = randomColor;
            btn.textContent = "Clicked!";
        });
    </script>
</body>
</html>
