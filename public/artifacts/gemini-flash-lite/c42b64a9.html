<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Portfolio</title>
    <style>
        :root {
            --bg: #f4f4f9;
            --text: #333;
            --accent: #6366f1;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            padding: 4rem 1rem;
            text-align: center;
        }
        section {
            max-width: 800px;
            width: 90%;
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }
        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        #counter {
            font-weight: bold;
            color: var(--accent);
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Website</h1>
        <p>Built with pure HTML, CSS, and JS.</p>
    </header>

    <section>
        <h2>Interactive Elements</h2>
        <p>This is a simple proof of concept. Click the button below to see basic JavaScript at work:</p>
        <button id="clickMe">Click Me!</button>
        <p>Button clicked <span id="counter">0</span> times.</p>
    </section>

    <script>
        let count = 0;
        const button = document.getElementById('clickMe');
        const counterDisplay = document.getElementById('counter');

        button.addEventListener('click', () => {
            count++;
            counterDisplay.textContent = count;
            button.style.transform = "scale(0.95)";
            setTimeout(() => button.style.transform = "scale(1)", 100);
        });
    </script>
</body>
</html>
