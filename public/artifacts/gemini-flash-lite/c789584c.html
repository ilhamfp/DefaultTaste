<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Portfolio Showcase</title>
    <style>
        :root {
            --primary: #6366f1;
            --dark: #0f172a;
            --light: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            background: var(--dark);
            color: var(--light);
            line-height: 1.6;
        }

        header {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        h1 { font-size: 3.5rem; margin-bottom: 0.5rem; color: var(--primary); }
        
        .btn {
            padding: 12px 30px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .btn:hover { transform: scale(1.1); }

        section { padding: 80px 20px; max-width: 800px; margin: auto; }

        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
        }

        footer { text-align: center; padding: 40px; opacity: 0.7; }
    </style>
</head>
<body>

    <header>
        <h1>Web Developer</h1>
        <p>Turning caffeine and ideas into digital reality.</p>
        <button class="btn" onclick="document.getElementById('about').scrollIntoView({behavior: 'smooth'})">View Projects</button>
    </header>

    <section id="about">
        <h2>About Me</h2>
        <div class="card">
            <p>I am a passionate web developer creating fast, responsive, and beautiful websites using modern technologies like HTML5, CSS3, and JavaScript.</p>
        </div>
    </section>

    <footer>
        <p>&copy; <script>document.write(new Date().getFullYear())</script> Built with passion.</p>
    </footer>

    <script>
        console.log("Website loaded successfully!");
        
        // Simple animation on scroll
        window.addEventListener('scroll', () => {
            const cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                const rect = card.getBoundingClientRect();
                if (rect.top < window.innerHeight) {
                    card.style.transition = 'opacity 1s';
                    card.style.opacity = '1';
                }
            });
        });
        
        // Initial setup
        document.querySelectorAll('.card').forEach(c => c.style.opacity = '0.5');
    </script>
</body>
</html>
