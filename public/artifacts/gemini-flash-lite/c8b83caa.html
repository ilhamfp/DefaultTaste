<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Portfolio</title>
    <style>
        :root {
            --bg: #f4f4f9;
            --text: #333;
            --accent: #6366f1;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            padding: 4rem 1rem;
            text-align: center;
        }
        .container {
            max-width: 800px;
            width: 90%;
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { color: var(--accent); }
        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 1rem;
        }
        button:hover { opacity: 0.9; }
        #message { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Site</h1>
        <p>Built with pure HTML, CSS, and JS.</p>
    </header>

    <div class="container">
        <h2>About</h2>
        <p>This is a self-contained web page. You can customize the contents, styling, or logic directly in this file.</p>
        
        <h2>Interaction</h2>
        <p>Click the button below to see a simple JavaScript interaction:</p>
        <button id="clickBtn">Click Me!</button>
        <p id="message"></p>
    </div>

    <script>
        const btn = document.getElementById('clickBtn');
        const msg = document.getElementById('message');

        btn.addEventListener('click', () => {
            const colors = ['#ef4444', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            
            msg.textContent = "Button clicked! Theme color changed.";
            msg.style.color = randomColor;
            
            document.documentElement.style.setProperty('--accent', randomColor);
        });
    </script>
</body>
</html>
