<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <style>
        :root {
            --primary: #2563eb;
            --dark: #1e293b;
            --light: #f8fafc;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            line-height: 1.6;
            color: var(--dark);
            background-color: var(--light);
        }
        header {
            background: var(--dark);
            color: white;
            padding: 2rem;
            text-align: center;
        }
        nav {
            background: #cbd5e1;
            padding: 1rem;
            text-align: center;
        }
        nav a {
            margin: 0 1rem;
            text-decoration: none;
            color: var(--dark);
            font-weight: bold;
        }
        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 1rem;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
        }
        #message {
            margin-top: 1rem;
            font-weight: bold;
            color: var(--primary);
        }
    </style>
</head>
<body>

<header>
    <h1>Welcome to My Website</h1>
    <p>Web Developer & Designer</p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">Projects</a>
    <a href="#">Contact</a>
</nav>

<div class="container">
    <h2>About Me</h2>
    <p>Hi! I am a passionate web developer creating clean, modern, and responsive user experiences.</p>
    
    <hr>
    
    <h2>Interactive Section</h2>
    <button id="actionBtn">Click for a surprise</button>
    <div id="message"></div>
</div>

<script>
    const btn = document.getElementById('actionBtn');
    const msg = document.getElementById('message');

    btn.addEventListener('click', () => {
        msg.textContent = "Hello! Thanks for clicking the button. Have a great day!";
        btn.style.backgroundColor = "#059669";
    });
</script>

</body>
</html>
