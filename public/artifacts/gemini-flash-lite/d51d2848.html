<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Personal Dashboard</title>
    <style>
        :root {
            --bg: #0f172a;
            --text: #f8fafc;
            --accent: #38bdf8;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            padding: 2rem;
            border: 1px solid #334155;
            border-radius: 1rem;
            background: #1e293b;
        }
        h1 { margin-top: 0; }
        #clock {
            font-size: 3rem;
            font-weight: bold;
            color: var(--accent);
            margin: 1rem 0;
        }
        button {
            background: var(--accent);
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 0.5rem;
            color: var(--bg);
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.8; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome</h1>
        <p>Current Time</p>
        <div id="clock">00:00:00</div>
        <button onclick="changeColor()">Change Theme</button>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString();
        }
        setInterval(updateClock, 1000);
        updateClock();

        function changeColor() {
            const colors = ['#f43f5e', '#10b981', '#8b5cf6', '#f59e0b'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            document.documentElement.style.setProperty('--accent', randomColor);
        }
    </script>
</body>
</html>
