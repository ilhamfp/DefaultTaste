<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Minimalist Portal</title>
    <style>
        :root {
            --bg: #0f172a;
            --text: #f8fafc;
            --accent: #38bdf8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--bg);
            color: var(--text);
            transition: background 0.5s ease;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
        }

        h1 { font-size: 3rem; margin-bottom: 0.5rem; }
        p { color: #94a3b8; margin-bottom: 2rem; }

        button {
            padding: 0.8rem 2rem;
            font-size: 1rem;
            cursor: pointer;
            background: var(--accent);
            border: none;
            border-radius: 50px;
            color: var(--bg);
            font-weight: bold;
            transition: transform 0.2s, background 0.2s;
        }

        button:hover {
            transform: scale(1.05);
            background: #7dd3fc;
        }

        #status {
            margin-top: 2rem;
            font-family: monospace;
            padding: 1rem;
            background: #1e293b;
            border-radius: 8px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome.</h1>
        <p>This is a self-contained web experience. Click the button below to interact with the environment.</p>
        <button id="actionBtn">Trigger Effect</button>
        <div id="status">System Initialized: Ready.</div>
    </div>

    <script>
        const btn = document.getElementById('actionBtn');
        const status = document.getElementById('status');
        let clicks = 0;

        btn.addEventListener('click', () => {
            clicks++;
            status.style.display = 'block';
            status.innerText = `Interaction logged: #${clicks}. The system is responsive.`;
            
            // Random color shift effect
            const randomColor = Math.floor(Math.random()*16777215).toString(16);
            document.body.style.backgroundColor = '#' + randomColor;
            
            if(clicks > 5) {
                status.innerText = "Maximum interaction threshold reached. Stability holding.";
            }
        });
    </script>
</body>
</html>
