<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Personal Portfolio</title>
    <style>
        :root {
            --bg: #f4f4f9;
            --text: #333;
            --accent: #6366f1;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            padding: 4rem 1rem;
            text-align: center;
        }
        .container {
            max-width: 800px;
            width: 90%;
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { color: var(--accent); }
        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        footer { margin-top: 2rem; padding: 1rem; font-size: 0.8rem; }
    </style>
</head>
<body>

    <header>
        <h1>Hello, World!</h1>
        <p>Welcome to my self-contained website.</p>
    </header>

    <div class="container">
        <h2>About This Page</h2>
        <p>This page is entirely self-contained in a single HTML file. It uses embedded CSS for styling and JavaScript for interactivity.</p>
        <button id="actionBtn">Click for a Surprise!</button>
        <p id="message"></p>
    </div>

    <footer>
        &copy; 2023 Built with pure HTML/CSS/JS
    </footer>

    <script>
        document.getElementById('actionBtn').addEventListener('click', function() {
            const msg = document.getElementById('message');
            msg.style.color = "var(--accent)";
            msg.innerText = "You clicked the button! JavaScript is working perfectly.";
        });
    </script>
</body>
</html>
