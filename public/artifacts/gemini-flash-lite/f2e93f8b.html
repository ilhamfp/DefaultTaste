<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Personal Portfolio</title>
    <style>
        :root {
            --bg: #f4f4f9;
            --text: #333;
            --accent: #6366f1;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            padding: 4rem 1rem;
            text-align: center;
        }
        .container {
            max-width: 800px;
            padding: 2rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: opacity 0.3s;
        }
        button:hover {
            opacity: 0.9;
        }
        #message {
            margin-top: 20px;
            font-weight: bold;
            color: var(--accent);
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Website</h1>
        <p>Built with pure HTML, CSS, and JS.</p>
    </header>

    <div class="container">
        <h2>About Me</h2>
        <p>I am a web developer passionate about crafting clean, efficient, and user-friendly digital experiences. This is a simple self-contained page.</p>
        
        <button id="actionBtn">Click for a Surprise</button>
        <div id="message"></div>
    </div>

    <script>
        document.getElementById('actionBtn').addEventListener('click', function() {
            const messages = [
                "Hello, world!",
                "Keep building amazing things!",
                "The code is working perfectly.",
                "Have a great day ahead!"
            ];
            const randomMsg = messages[Math.floor(Math.random() * messages.length)];
            document.getElementById('message').innerText = randomMsg;
        });
    </script>
</body>
</html>
