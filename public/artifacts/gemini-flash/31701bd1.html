<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Card Generator</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
            color: #333;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
        }

        .controls {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 40px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px 30px;
            width: 100%;
            max-width: 700px;
            box-sizing: border-box;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }

        input[type="text"],
        input[type="number"],
        textarea,
        select {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
            box-sizing: border-box;
            width: 100%;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            grid-column: 1 / -1; /* Span across both columns */
            padding: 12px 25px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        button:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }

        #cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .card h2 {
            margin: 0;
            color: #34495e;
            font-size: 1.6em;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
        }

        .card p {
            margin: 0;
            line-height: 1.6;
            color: #666;
        }

        .card .category {
            font-size: 0.9em;
            color: #95a5a6;
            background-color: #f0f3f5;
            padding: 5px 10px;
            border-radius: 5px;
            align-self: flex-start;
        }

        .card .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            font-size: 1.2em;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .card .delete-btn:hover {
            background-color: #c0392b;
        }

        #empty-state {
            text-align: center;
            color: #7f8c8d;
            font-size: 1.2em;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <h1>Dynamic Card Generator</h1>

    <div class="controls">
        <div class="input-group">
            <label for="cardTitle">Card Title:</label>
            <input type="text" id="cardTitle" placeholder="e.g., Important Note">
        </div>
        <div class="input-group">
            <label for="cardCategory">Category:</label>
            <select id="cardCategory">
                <option value="General">General</option>
                <option value="Work">Work</option>
                <option value="Personal">Personal</option>
                <option value="Learning">Learning</option>
                <option value="Reminder">Reminder</option>
            </select>
        </div>
        <div class="input-group" style="grid-column: 1 / -1;">
            <label for="cardContent">Card Content:</label>
            <textarea id="cardContent" placeholder="Write your card content here..."></textarea>
        </div>
        <button id="addCardBtn">Add Card</button>
    </div>

    <div id="cards-container">
        <p id="empty-state">No cards yet. Add your first card above!</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const addCardBtn = document.getElementById('addCardBtn');
            const cardTitleInput = document.getElementById('cardTitle');
            const cardCategorySelect = document.getElementById('cardCategory');
            const cardContentInput = document.getElementById('cardContent');
            const cardsContainer = document.getElementById('cards-container');
            const emptyState = document.getElementById('empty-state');

            // Load cards from localStorage on page load
            loadCards();

            addCardBtn.addEventListener('click', addCard);

            function addCard() {
                const title = cardTitleInput.value.trim();
                const category = cardCategorySelect.value;
                const content = cardContentInput.value.trim();

                if (!title || !content) {
                    alert('Please provide both a title and content for the card.');
                    return;
                }

                const cardData = {
                    id: Date.now(), // Unique ID for each card
                    title,
                    category,
                    content
                };

                createCardElement(cardData);
                saveCard(cardData);

                // Clear form fields
                cardTitleInput.value = '';
                cardContentInput.value = '';
                cardCategorySelect.value = 'General'; // Reset to default

                updateEmptyState();
            }

            function createCardElement(data) {
                const card = document.createElement('div');
                card.classList.add('card');
                card.setAttribute('data-id', data.id);

                card.innerHTML = `
                    <button class="delete-btn">&times;</button>
                    <span class="category">${data.category}</span>
                    <h2>${data.title}</h2>
                    <p>${data.content}</p>
                `;

                const deleteBtn = card.querySelector('.delete-btn');
                deleteBtn.addEventListener('click', () => {
                    cardsContainer.removeChild(card);
                    removeCard(data.id);
                    updateEmptyState();
                });

                if (emptyState) {
                    emptyState.style.display = 'none'; // Hide empty state when a card is added
                }
                cardsContainer.prepend(card); // Add new cards to the top
            }

            function saveCard(cardData) {
                let cards = JSON.parse(localStorage.getItem('cards')) || [];
                cards.push(cardData);
                localStorage.setItem('cards', JSON.stringify(cards));
            }

            function loadCards() {
                let cards = JSON.parse(localStorage.getItem('cards')) || [];
                cards.forEach(cardData => createCardElement(cardData));
                updateEmptyState();
            }

            function removeCard(id) {
                let cards = JSON.parse(localStorage.getItem('cards')) || [];
                cards = cards.filter(card => card.id !== id);
                localStorage.setItem('cards', JSON.stringify(cards));
            }

            function updateEmptyState() {
                if (cardsContainer.children.length === 0 || 
                    (cardsContainer.children.length === 1 && cardsContainer.children[0].id === 'empty-state')) {
                    if (!emptyState) { // If empty state was removed somehow, recreate it
                        const newEmptyState = document.createElement('p');
                        newEmptyState.id = 'empty-state';
                        newEmptyState.textContent = 'No cards yet. Add your first card above!';
                        cardsContainer.appendChild(newEmptyState);
                    } else {
                        emptyState.style.display = 'block';
                    }
                } else if (emptyState) {
                    emptyState.style.display = 'none';
                }
            }
        });
    </script>
</body>
</html>
