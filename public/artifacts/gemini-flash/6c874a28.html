<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Fun Page</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f8ff;
            color: #333;
            transition: background-color 0.5s ease;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            color: #4682b4;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.1em;
            line-height: 1.6;
        }
        .container {
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            padding: 30px;
            width: 80%;
            max-width: 700px;
            text-align: center;
        }
        .button-group {
            margin-top: 25px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }
        button {
            background-color: #6a5acd;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        button:hover {
            background-color: #483d8b;
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(0);
        }
        #message-display {
            margin-top: 20px;
            font-size: 1.2em;
            color: #2e8b57;
            font-weight: bold;
            min-height: 30px;
        }
        #color-box {
            width: 80px;
            height: 80px;
            background-color: #ffdab9;
            margin: 30px auto;
            border-radius: 50%;
            border: 3px solid #ffa07a;
            transition: background-color 0.5s ease, transform 0.5s ease;
        }
        #color-box.expanded {
            transform: scale(1.2);
            border-color: #ff6347;
        }
        footer {
            margin-top: 40px;
            font-size: 0.9em;
            color: #777;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to Our Dynamic Web Page!</h1>
        <p>Explore some interactive features below.</p>
    </header>

    <div class="container">
        <h2>Interactive Section</h2>
        <p>Click the buttons to see what happens!</p>

        <div class="button-group">
            <button id="alertButton">Show Alert</button>
            <button id="changeTextButton">Change Message</button>
            <button id="toggleColorButton">Toggle Color Box</button>
            <button id="randomBackgroundButton">Random Background</button>
        </div>

        <div id="message-display"></div>

        <div id="color-box"></div>
    </div>

    <footer>
        <p>&copy; 2023 Dynamic Page. All rights reserved.</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const alertButton = document.getElementById('alertButton');
            const changeTextButton = document.getElementById('changeTextButton');
            const toggleColorButton = document.getElementById('toggleColorButton');
            const randomBackgroundButton = document.getElementById('randomBackgroundButton');
            const messageDisplay = document.getElementById('message-display');
            const colorBox = document.getElementById('color-box');
            const body = document.body;

            alertButton.addEventListener('click', () => {
                alert('Hello from the web page!');
            });

            changeTextButton.addEventListener('click', () => {
                const messages = [
                    "You clicked the button!",
                    "That was fun!",
                    "Keep clicking for more!",
                    "Text updated successfully!",
                    "Isn't this interactive?",
                    "Another message for you!"
                ];
                const randomIndex = Math.floor(Math.random() * messages.length);
                messageDisplay.textContent = messages[randomIndex];
                messageDisplay.style.color = `hsl(${Math.random() * 360}, 70%, 50%)`; // Random color for message
            });

            toggleColorButton.addEventListener('click', () => {
                colorBox.classList.toggle('expanded');
                if (colorBox.classList.contains('expanded')) {
                    colorBox.style.backgroundColor = '#87cefa'; // Light sky blue
                } else {
                    colorBox.style.backgroundColor = '#ffdab9'; // Peach puff
                }
            });

            randomBackgroundButton.addEventListener('click', () => {
                const randomColor = `hsl(${Math.random() * 360}, 70%, 90%)`;
                body.style.backgroundColor = randomColor;
                document.querySelector('h1').style.color = `hsl(${Math.random() * 360}, 50%, 40%)`;
            });
        });
    </script>
</body>
</html>
