<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Welcome Page</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
            color: #333;
            transition: background-color 0.5s ease;
        }

        .container {
            background-color: #fff;
            padding: 40px 60px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 600px;
            width: 90%;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: #4CAF50;
            margin-bottom: 20px;
            font-size: 2.5em;
            letter-spacing: 1px;
        }

        p {
            font-size: 1.1em;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }

        input[type="text"],
        input[type="email"] {
            width: calc(100% - 20px);
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="email"]:focus {
            border-color: #4CAF50;
            outline: none;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.3);
        }

        button {
            background-color: #4CAF50;
            color: white;
            padding: 14px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.1em;
            transition: background-color 0.3s ease, transform 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        button:hover {
            background-color: #45a049;
            transform: translateY(-2px);
        }

        #welcomeMessage {
            margin-top: 30px;
            padding: 15px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background-color: #e8f5e9;
            color: #2e7d32;
            font-weight: bold;
            display: none; /* Initially hidden */
            animation: slideIn 0.8s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .footer {
            margin-top: 50px;
            font-size: 0.8em;
            color: #aaa;
        }

        .dark-mode {
            background-color: #222;
            color: #eee;
        }

        .dark-mode .container {
            background-color: #333;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .dark-mode h1 {
            color: #8bc34a;
        }

        .dark-mode label {
            color: #ccc;
        }

        .dark-mode input[type="text"],
        .dark-mode input[type="email"] {
            background-color: #444;
            border-color: #555;
            color: #eee;
        }

        .dark-mode input[type="text"]:focus,
        .dark-mode input[type="email"]:focus {
            border-color: #8bc34a;
            box-shadow: 0 0 5px rgba(139, 195, 74, 0.3);
        }

        .dark-mode button {
            background-color: #8bc34a;
        }

        .dark-mode button:hover {
            background-color: #7cb342;
        }

        .dark-mode #welcomeMessage {
            background-color: #384239;
            border-color: #4abd50;
            color: #c8e6c9;
        }

        .theme-toggle-button {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: #607d8b;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            transition: background-color 0.3s ease;
        }

        .theme-toggle-button:hover {
            background-color: #546e7a;
        }
    </style>
</head>
<body>
    <button class="theme-toggle-button" id="themeToggle">Toggle Dark Mode</button>

    <div class="container">
        <h1>Welcome to Our Dynamic Page!</h1>
        <p>
            Please tell us a little about yourself, and we'll personalize your experience.
        </p>

        <div class="input-group">
            <label for="name">Your Name:</label>
            <input type="text" id="name" placeholder="Enter your name">
        </div>

        <div class="input-group">
            <label for="email">Your Email (Optional):</label>
            <input type="email" id="email" placeholder="Enter your email address">
        </div>

        <button id="greetButton">Personalize My Experience</button>

        <div id="welcomeMessage">
            <!-- Welcome message will be displayed here -->
        </div>

        <div class="footer">
            &copy; <span id="currentYear"></span> Your Company Name. All rights reserved.
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const nameInput = document.getElementById('name');
            const emailInput = document.getElementById('email');
            const greetButton = document.getElementById('greetButton');
            const welcomeMessageDiv = document.getElementById('welcomeMessage');
            const currentYearSpan = document.getElementById('currentYear');
            const themeToggleButton = document.getElementById('themeToggle');
            const body = document.body;

            currentYearSpan.textContent = new Date().getFullYear();

            greetButton.addEventListener('click', () => {
                const name = nameInput.value.trim();
                const email = emailInput.value.trim();

                let message = '';
                if (name) {
                    message = `Hello, ${name}! Thanks for visiting.`;
                    if (email) {
                        message += ` We've noted your email: ${email}.`;
                    }
                    message += ` Enjoy your stay!`;
                } else {
                    message = 'Hello, anonymous visitor! Please enter your name to personalize your experience.';
                }

                welcomeMessageDiv.textContent = message;
                welcomeMessageDiv.style.display = 'block'; // Make the message visible

                // Optional: Clear inputs after greeting
                // nameInput.value = '';
                // emailInput.value = '';
            });

            themeToggleButton.addEventListener('click', () => {
                body.classList.toggle('dark-mode');
                if (body.classList.contains('dark-mode')) {
                    localStorage.setItem('theme', 'dark');
                    themeToggleButton.textContent = 'Toggle Light Mode';
                } else {
                    localStorage.setItem('theme', 'light');
                    themeToggleButton.textContent = 'Toggle Dark Mode';
                }
            });

            // Check for saved theme preference
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                body.classList.add('dark-mode');
                themeToggleButton.textContent = 'Toggle Light Mode';
            } else {
                themeToggleButton.textContent = 'Toggle Dark Mode';
            }
        });
    </script>
</body>
</html>
