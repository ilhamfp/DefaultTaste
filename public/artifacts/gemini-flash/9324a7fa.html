<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Interactive Web Page</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f8ff;
            color: #333;
            transition: background-color 0.5s ease;
        }
        .container {
            background-color: #ffffff;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: 600px;
            width: 90%;
            transition: transform 0.3s ease;
        }
        .container:hover {
            transform: translateY(-5px);
        }
        h1 {
            color: #4682b4;
            margin-bottom: 20px;
            font-size: 2.5em;
        }
        p {
            line-height: 1.6;
            margin-bottom: 25px;
            font-size: 1.1em;
        }
        .button-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        button {
            padding: 12px 25px;
            font-size: 1.1em;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background-color: #6a5acd;
            color: white;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        button:hover {
            background-color: #483d8b;
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(0);
        }
        #message {
            margin-top: 30px;
            font-size: 1.2em;
            color: #dc143c;
            font-weight: bold;
        }
        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 1.8em;
            cursor: pointer;
            color: #888;
            transition: color 0.3s ease;
        }
        .theme-toggle:hover {
            color: #333;
        }
        body.dark-mode {
            background-color: #2c2c2c;
            color: #e0e0e0;
        }
        body.dark-mode .container {
            background-color: #3f3f3f;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        }
        body.dark-mode h1 {
            color: #92a8d1;
        }
        body.dark-mode button {
            background-color: #555c8f;
            color: #e0e0e0;
        }
        body.dark-mode button:hover {
            background-color: #3e446b;
        }
        body.dark-mode .theme-toggle {
            color: #ccc;
        }
        body.dark-mode .theme-toggle:hover {
            color: #fff;
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle">☀️</button>

    <div class="container">
        <h1 id="mainHeading">Welcome to My Interactive Page!</h1>
        <p>This is a simple web page demonstrating basic HTML, CSS, and JavaScript interactions. Click the buttons below to see some dynamic changes!</p>
        <p id="dynamicText">Current status: Ready for interaction.</p>
        <div class="button-group">
            <button id="changeTextBtn">Change Text</button>
            <button id="showAlertBtn">Show Alert</button>
        </div>
        <p id="message"></p>
    </div>

    <script>
        const changeTextBtn = document.getElementById('changeTextBtn');
        const showAlertBtn = document.getElementById('showAlertBtn');
        const mainHeading = document.getElementById('mainHeading');
        const dynamicText = document.getElementById('dynamicText');
        const messageDisplay = document.getElementById('message');
        const themeToggle = document.getElementById('themeToggle');
        let textChanged = false;

        changeTextBtn.addEventListener('click', () => {
            if (!textChanged) {
                mainHeading.textContent = "You've Changed It!";
                dynamicText.textContent = "The content has been updated by JavaScript!";
                messageDisplay.textContent = "Text successfully changed!";
                messageDisplay.style.color = '#28a745';
                changeTextBtn.textContent = "Reset Text";
                textChanged = true;
            } else {
                mainHeading.textContent = "Welcome to My Interactive Page!";
                dynamicText.textContent = "Current status: Ready for interaction.";
                messageDisplay.textContent = "Text reset to original.";
                messageDisplay.style.color = '#17a2b8';
                changeTextBtn.textContent = "Change Text";
                textChanged = false;
            }
        });

        showAlertBtn.addEventListener('click', () => {
            alert('Hello from an interactive alert box!');
            messageDisplay.textContent = "You just dismissed an alert!";
            messageDisplay.style.color = '#ffc107';
        });

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            if (document.body.classList.contains('dark-mode')) {
                themeToggle.innerHTML = '🌙';
                messageDisplay.textContent = "Dark mode activated!";
                messageDisplay.style.color = '#8be9fd';
            } else {
                themeToggle.innerHTML = '☀️';
                messageDisplay.textContent = "Light mode activated!";
                messageDisplay.style.color = '#f8f8f2';
            }
        });

        // Initialize message display to be empty or a default message
        window.onload = () => {
            messageDisplay.textContent = "";
        };
    </script>
</body>
</html>
