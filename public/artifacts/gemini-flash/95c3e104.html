<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Fun Page</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #f06, #4a90e2);
            color: #fff;
            overflow: hidden;
            text-align: center;
        }
        .container {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            padding: 40px;
            margin: 20px;
            max-width: 800px;
            color: #333;
            transition: transform 0.3s ease-in-out;
        }
        .container:hover {
            transform: translateY(-5px);
        }
        h1 {
            color: #ff4a68;
            margin-bottom: 20px;
            font-size: 2.8em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        p {
            font-size: 1.1em;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        button {
            background-color: #4a90e2;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1.1em;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        button:hover {
            background-color: #357ABD;
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(0);
        }
        #message {
            margin-top: 30px;
            font-size: 1.3em;
            color: #ff4a68;
            font-weight: bold;
        }
        .footer {
            margin-top: 40px;
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.8);
        }

        /* Confetti effect */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f0f;
            animation: fall linear forwards;
            opacity: 0;
            border-radius: 50%;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Our Dynamic Fun Page!</h1>
        <p>This is a simple, interactive webpage designed to demonstrate HTML, CSS, and JavaScript working together. Click the button below to see some magic happen!</p>
        <button id="actionButton">Click Me for Fun!</button>
        <div id="message"></div>
    </div>
    <div class="footer">
        &copy; 2023 Fun Web Development
    </div>

    <script>
        const button = document.getElementById('actionButton');
        const messageDiv = document.getElementById('message');
        const colors = ['#f06', '#4a90e2', '#7ED321', '#F5A623', '#BD10E0'];
        let clickCount = 0;

        button.addEventListener('click', () => {
            clickCount++;
            let msg;
            switch (clickCount % 5) {
                case 1:
                    msg = "Wow! You clicked it!";
                    document.body.style.background = 'linear-gradient(135deg, #7ED321, #00C6FF)';
                    break;
                case 2:
                    msg = "Again? You're a click champion!";
                    document.body.style.background = 'linear-gradient(135deg, #F5A623, #FF7B00)';
                    break;
                case 3:
                    msg = "Three times a charm! Let's get colorful.";
                    document.body.style.background = 'linear-gradient(135deg, #BD10E0, #FF00FF)';
                    break;
                case 4:
                    msg = "Keep going! What happens next?";
                    document.body.style.background = 'linear-gradient(135deg, #F06, #4a90e2)';
                    break;
                case 0:
                    msg = "Surprise! 🎉 Let's throw some confetti!";
                    document.body.style.background = 'linear-gradient(135deg, #FFD700, #FF69B4)';
                    createConfetti();
                    break;
                default:
                    msg = "You're enjoying this, aren't you?";
            }
            messageDiv.textContent = msg;
            button.textContent = `Click Me Again! (${clickCount})`;
            
            // Random container background on each click
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            document.querySelector('.container').style.backgroundColor = `rgba(255, 255, 255, 0.95)`;
            document.querySelector('.container h1').style.color = randomColor;
        });

        function createConfetti() {
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = Math.random() * 2 + 3 + 's'; // 3-5 seconds
                confetti.style.animationDelay = Math.random() * 0.5 + 's';
                document.body.appendChild(confetti);

                confetti.addEventListener('animationend', () => {
                    confetti.remove();
                });
            }
        }

        // Initial message
        messageDiv.textContent = "Click the button to start the fun!";
    </script>
</body>
</html>
