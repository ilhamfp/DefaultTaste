<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Card Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
        }
        .controls {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            align-items: center;
        }
        .controls label {
            font-weight: bold;
            color: #555;
            margin-right: 5px;
        }
        .controls input[type="number"],
        .controls input[type="text"],
        .controls textarea {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 150px;
        }
        .controls textarea {
            width: 250px;
            resize: vertical;
        }
        .controls button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }
        .controls button:hover {
            background-color: #0056b3;
        }
        #card-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
            padding-top: 20px;
        }
        .card {
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
            display: flex;
            flex-direction: column;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
        }
        .card-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-bottom: 1px solid #eee;
        }
        .card-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .card-title {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 10px;
            font-weight: 600;
        }
        .card-description {
            font-size: 0.95em;
            color: #666;
            line-height: 1.6;
            flex-grow: 1;
        }
        .card-footer {
            margin-top: 15px;
            font-size: 0.85em;
            color: #888;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }
    </style>
</head>
<body>
    <h1>Dynamic Card Generator</h1>

    <div class="controls">
        <div>
            <label for="cardCount">Number of Cards:</label>
            <input type="number" id="cardCount" min="1" value="3">
        </div>
        <div>
            <label for="titlePrefix">Title Prefix:</label>
            <input type="text" id="titlePrefix" value="Card">
        </div>
        <div>
            <label for="descriptionText">Description Base:</label>
            <textarea id="descriptionText">This is a wonderful description for card number</textarea>
        </div>
        <button onclick="generateCards()">Generate Cards</button>
    </div>

    <div id="card-container">
        <!-- Cards will be injected here by JavaScript -->
    </div>

    <script>
        function generateCards() {
            const cardContainer = document.getElementById('card-container');
            cardContainer.innerHTML = ''; // Clear existing cards

            const cardCount = parseInt(document.getElementById('cardCount').value);
            const titlePrefix = document.getElementById('titlePrefix').value;
            const descriptionText = document.getElementById('descriptionText').value;

            if (isNaN(cardCount) || cardCount <= 0) {
                alert("Please enter a valid number of cards (greater than 0).");
                return;
            }

            for (let i = 1; i <= cardCount; i++) {
                const card = document.createElement('div');
                card.classList.add('card');

                const imageUrl = `https://picsum.photos/400/300?random=${i}`; // Dynamic image url

                card.innerHTML = `
                    <img src="${imageUrl}" alt="${titlePrefix} ${i}" class="card-image">
                    <div class="card-content">
                        <h2 class="card-title">${titlePrefix} ${i}</h2>
                        <p class="card-description">${descriptionText} ${i}. It provides insightful information and is visually appealing.</p>
                        <div class="card-footer">Generated on: ${new Date().toLocaleDateString()}</div>
                    </div>
                `;
                cardContainer.appendChild(card);
            }
        }

        // Generate cards on page load
        document.addEventListener('DOMContentLoaded', generateCards);
    </script>
</body>
</html>
