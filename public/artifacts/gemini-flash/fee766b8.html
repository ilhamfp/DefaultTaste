<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Welcome Page</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #f06, #4a90e2);
            color: white;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.15);
            padding: 40px 60px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            max-width: 800px;
            z-index: 10;
            position: relative;
            animation: fadeIn 1.5s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 3.5em;
            margin-bottom: 20px;
            text-shadow: 0 3px 6px rgba(0, 0, 0, 0.3);
            animation: bounceIn 2s ease-out;
        }

        @keyframes bounceIn {
            0%, 20%, 40%, 60%, 80%, 100% {
                transition-timing-function: cubic-bezier(0.215, 0.610, 0.355, 1.000);
            }
            0% {
                opacity: 0;
                transform: scale3d(.3, .3, .3);
            }
            20% {
                transform: scale3d(1.1, 1.1, 1.1);
            }
            40% {
                transform: scale3d(.9, .9, .9);
            }
            60% {
                opacity: 1;
                transform: scale3d(1.03, 1.03, 1.03);
            }
            80% {
                transform: scale3d(.97, .97, .97);
            }
            100% {
                opacity: 1;
                transform: scale3d(1, 1, 1);
            }
        }

        p {
            font-size: 1.3em;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .button {
            display: inline-block;
            background-color: #ffb703;
            color: #333;
            padding: 15px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1em;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .button:hover {
            background-color: #fb8500;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        #time-display {
            margin-top: 30px;
            font-size: 1.1em;
            font-weight: 300;
            opacity: 0.8;
        }

        .background-circles div {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            pointer-events: none;
            animation: floatCircles 15s infinite ease-in-out;
        }

        .background-circles div:nth-child(1) { width: 60px; height: 60px; top: 10%; left: 15%; animation-duration: 18s; }
        .background-circles div:nth-child(2) { width: 100px; height: 100px; top: 30%; left: 80%; animation-duration: 22s; }
        .background-circles div:nth-child(3) { width: 80px; height: 80px; top: 70%; left: 20%; animation-duration: 16s; }
        .background-circles div:nth-child(4) { width: 120px; height: 120px; top: 50%; left: 50%; animation-duration: 20s; }
        .background-circles div:nth-child(5) { width: 70px; height: 70px; top: 85%; left: 70%; animation-duration: 17s; }
        .background-circles div:nth-child(6) { width: 90px; height: 90px; top: 5%; left: 60%; animation-duration: 19s; }
        .background-circles div:nth-child(7) { width: 50px; height: 50px; top: 40%; left: 5%; animation-duration: 15s; }

        @keyframes floatCircles {
            0% { transform: translateY(0) translateX(0) scale(1); opacity: 0.1; }
            25% { transform: translateY(-20px) translateX(10px) scale(0.9); opacity: 0.2; }
            50% { transform: translateY(0) translateX(0) scale(1.1); opacity: 0.15; }
            75% { transform: translateY(20px) translateX(-10px) scale(0.95); opacity: 0.2; }
            100% { transform: translateY(0) translateX(0) scale(1); opacity: 0.1; }
        }

        @media (max-width: 768px) {
            .container {
                padding: 30px 40px;
            }
            h1 {
                font-size: 2.5em;
            }
            p {
                font-size: 1.1em;
            }
            .button {
                padding: 12px 25px;
                font-size: 1em;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px 25px;
            }
            h1 {
                font-size: 2em;
            }
            p {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="background-circles">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
    </div>

    <div class="container">
        <h1 id="welcome-header">Hello, World!</h1>
        <p>This is a dynamically generated and styled welcome page. Enjoy the beautiful gradients and interactive elements!</p>
        <a href="#" class="button" onclick="changeContent()">Change Content</a>
        <div id="time-display"></div>
    </div>

    <script>
        const welcomeHeader = document.getElementById('welcome-header');
        const timeDisplay = document.getElementById('time-display');
        const phrases = [
            "Welcome to My Page!",
            "Greetings, Traveler!",
            "Hola! Bienvenue!",
            "Hello, Friend!",
            "Explore the Experience!",
            "A Warm Welcome!"
        ];
        let phraseIndex = 0;

        function updateTime() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' };
            timeDisplay.textContent = `Current time: ${now.toLocaleTimeString('en-US', options)}`;
        }

        function changeContent() {
            phraseIndex = (phraseIndex + 1) % phrases.length;
            welcomeHeader.textContent = phrases[phraseIndex];
            // Add a subtle animation when content changes
            welcomeHeader.style.animation = 'none'; // Reset animation
            void welcomeHeader.offsetWidth; // Trigger reflow
            welcomeHeader.style.animation = 'bounceIn 1s ease-out'; // Reapply animation
        }

        // Initial call to display time
        updateTime();
        // Update time every second
        setInterval(updateTime, 1000);

        // Example of a simple interaction on load
        window.onload = () => {
            console.log("Page loaded successfully!");
            // You could display a welcome message based on time of day here if desired
            // const hour = new Date().getHours();
            // if (hour < 12) {
            //     welcomeHeader.textContent = "Good Morning!";
            // } else if (hour < 18) {
            //     welcomeHeader.textContent = "Good Afternoon!";
            // } else {
            //     welcomeHeader.textContent = "Good Evening!";
            // }
        };
    </script>
</body>
</html>
