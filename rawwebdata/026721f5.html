<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Personal Space</title>
    <style>
        :root {
            --bg: #f4f4f9;
            --text: #333;
            --accent: #6366f1;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg);
            color: var(--text);
            text-align: center;
        }
        .container {
            padding: 2rem;
            background: white;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        h1 { margin-bottom: 0.5rem; }
        button {
            margin-top: 1.5rem;
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            background: var(--accent);
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }
        button:hover { transform: scale(1.05); }
        #date { margin-top: 1rem; font-size: 0.9rem; color: #888; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to My Space</h1>
        <p>This is a self-contained web page built with HTML, CSS, and JS.</p>
        <button onclick="changeColor()">Click for Random Color</button>
        <div id="date"></div>
    </div>

    <script>
        document.getElementById('date').innerText = "Today is " + new Date().toDateString();

        function changeColor() {
            const colors = ['#f4f4f9', '#fff0f0', '#f0fff4', '#f0f4ff', '#fffcf0'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            document.body.style.backgroundColor = randomColor;
        }
    </script>
</body>
</html>
