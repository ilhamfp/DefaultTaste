<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Portfolio</title>
    <style>
        :root {
            --bg: #f4f4f9;
            --text: #333;
            --accent: #4a90e2;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            padding: 4rem 1rem;
            text-align: center;
        }
        .container {
            max-width: 800px;
            padding: 2rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }
        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.05);
        }
        #message {
            margin-top: 1rem;
            font-weight: bold;
            color: var(--accent);
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Website</h1>
        <p>Built with pure HTML, CSS, and JS.</p>
    </header>

    <div class="container">
        <h2>About This Page</h2>
        <p>This is a self-contained web page. It demonstrates how simple content can be structured without external dependencies. Click the button below to see a small interaction.</p>
        
        <button id="actionBtn">Click Me!</button>
        <p id="message"></p>
    </div>

    <script>
        const btn = document.getElementById('actionBtn');
        const msg = document.getElementById('message');

        btn.addEventListener('click', () => {
            const colors = ['#e74c3c', '#27ae60', '#f1c40f', '#8e44ad'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            
            msg.textContent = "Button clicked! The theme color intensity has been noted.";
            document.body.style.backgroundColor = randomColor;
            
            setTimeout(() => {
                document.body.style.backgroundColor = '#f4f4f9';
            }, 500);
        });
    </script>
</body>
</html>
