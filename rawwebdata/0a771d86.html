<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Greeting Card</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #f06, #4a90e2);
            color: #fff;
            overflow: hidden;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 30px 40px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            position: relative;
            z-index: 1;
            transition: all 0.5s ease;
            transform: scale(1);
        }

        .container.expanded {
            transform: scale(1.1);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }

        p {
            color: #555;
            font-size: 1.1em;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        input[type="text"] {
            width: calc(100% - 20px);
            padding: 12px;
            margin-bottom: 20px;
            border: 2px solid #ccc;
            border-radius: 8px;
            font-size: 1em;
            outline: none;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: #4a90e2;
        }

        button {
            background-color: #4a90e2;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1em;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        button:hover {
            background-color: #357ABD;
            transform: translateY(-2px);
        }

        .greeting {
            margin-top: 30px;
            font-size: 1.8em;
            font-weight: bold;
            color: #e63946;
            min-height: 40px;
            transform: scale(0);
            opacity: 0;
            transition: transform 0.5s ease, opacity 0.5s ease;
        }

        .greeting.show {
            transform: scale(1);
            opacity: 1;
        }

        /* Animated background particles */
        .particle {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
            animation: float 10s infinite ease-in-out;
            opacity: 0;
            transition: opacity 1s ease-out;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); opacity: 0.8; }
            50% { transform: translateY(-20px) rotate(180deg); opacity: 0.5; }
            100% { transform: translateY(0px) rotate(360deg); opacity: 0.8; }
        }

        .particle.show {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <h1>Welcome!</h1>
        <p>Enter your name below to receive a personalized greeting.</p>
        <input type="text" id="nameInput" placeholder="Your Name">
        <button id="greetButton">Greet Me!</button>
        <div class="greeting" id="greetingMessage"></div>
    </div>

    <script>
        const nameInput = document.getElementById('nameInput');
        const greetButton = document.getElementById('greetButton');
        const greetingMessage = document.getElementById('greetingMessage');
        const mainContainer = document.getElementById('mainContainer');

        greetButton.addEventListener('click', generateGreeting);
        nameInput.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                generateGreeting();
            }
        });

        function generateGreeting() {
            const name = nameInput.value.trim();
            if (name) {
                greetingMessage.textContent = `Hello, ${name}! Welcome to my page!`;
                greetingMessage.classList.add('show');
                mainContainer.classList.add('expanded');
                createParticles(10); // Generate 10 particles on greeting
            } else {
                greetingMessage.textContent = 'Please enter your name!';
                greetingMessage.classList.add('show');
                mainContainer.classList.remove('expanded');
            }
            // Clear message after a few seconds
            setTimeout(() => {
                greetingMessage.classList.remove('show');
            }, 5000);
        }

        function createParticles(count) {
            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                document.body.appendChild(particle);

                const size = Math.random() * 15 + 5; // 5px to 20px
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${Math.random() * 100}vw`;
                particle.style.top = `${Math.random() * 100}vh`;
                particle.style.animationDuration = `${Math.random() * 5 + 5}s`; // 5s to 10s
                particle.style.animationDelay = `${Math.random() * 2}s`;
                particle.style.backgroundColor = `rgba(255, 255, 255, ${Math.random() * 0.5 + 0.3})`;
                
                // Trigger animation and then remove
                setTimeout(() => {
                    particle.classList.add('show');
                }, 50);

                setTimeout(() => {
                    particle.style.opacity = 0;
                    setTimeout(() => {
                        particle.remove();
                    }, 1000); // Allow fade out before removing
                }, Math.random() * 3000 + 3000); // Particles last 3-6 seconds
            }
        }

        // Initial particles for background ambience
        createParticles(20);
        setInterval(() => createParticles(5), 5000); // Add a few new particles every 5 seconds
    </script>
</body>
</html>
