<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Portfolio Page</title>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --text: #f8fafc;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }
        header {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
        }
        h1 { font-size: 3.5rem; margin-bottom: 0.5rem; }
        button {
            padding: 12px 30px;
            background: var(--primary);
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s;
        }
        button:hover { transform: scale(1.05); }
        .section { padding: 80px 20px; max-width: 800px; margin: auto; }
        #date { color: var(--primary); font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>Web Developer</h1>
        <p>Turning caffeine into clean code.</p>
        <button onclick="showAlert()">Click Me</button>
    </header>

    <div class="section">
        <h2>About Me</h2>
        <p>Welcome to this self-contained HTML page. It includes CSS for styling, HTML for structure, and JavaScript for interactivity. Today is <span id="date"></span>.</p>
    </div>

    <script>
        document.getElementById('date').innerText = new Date().toDateString();
        
        function showAlert() {
            alert('Hello! Thanks for visiting my site.');
        }
    </script>
</body>
</html>
