<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Portfolio</title>
    <style>
        :root {
            --bg: #f4f4f9;
            --text: #333;
            --accent: #6366f1;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }
        nav {
            padding: 2rem;
            text-align: center;
        }
        header {
            height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 800px;
            margin: auto;
            padding: 0 20px;
        }
        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        button:hover {
            opacity: 0.9;
        }
        #message {
            margin-top: 20px;
            font-weight: bold;
            color: var(--accent);
        }
    </style>
</head>
<body>

    <nav>
        <h1>DevFolio</h1>
    </nav>

    <header>
        <h1>Building Digital Experiences</h1>
        <p>Full-stack developer focused on clean, scalable code.</p>
        <button id="ctaBtn">Click for a surprise</button>
        <div id="message"></div>
    </header>

    <section class="container">
        <h2>About</h2>
        <p>Welcome to my personal site. I love building things for the web and learning new technologies daily. Currently exploring HTML5, CSS3, and JavaScript.</p>
    </section>

    <script>
        const btn = document.getElementById('ctaBtn');
        const msg = document.getElementById('message');

        btn.addEventListener('click', () => {
            const messages = [
                "Hello, world! 🚀",
                "Keep shipping code! 💻",
                "You're doing great! ✨",
                "Coffee up and build something! ☕"
            ];
            const randomMsg = messages[Math.floor(Math.random() * messages.length)];
            msg.textContent = randomMsg;
        });
    </script>
</body>
</html>
