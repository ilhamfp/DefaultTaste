<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Portfolio Page</title>
    <style>
        :root {
            --primary: #6366f1;
            --dark: #1e293b;
            --light: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: var(--light);
            color: var(--dark);
            line-height: 1.6;
        }

        nav {
            padding: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            text-align: center;
        }

        header {
            margin: 4rem 0;
        }

        h1 { font-size: 3rem; margin-bottom: 1rem; color: var(--primary); }

        .btn {
            background: var(--primary);
            color: white;
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s;
        }

        .btn:hover { transform: scale(1.05); }

        #counter {
            margin-top: 2rem;
            font-weight: bold;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <nav>
        <div style="font-weight: bold; font-size: 1.5rem;">DevSpace</div>
        <div id="date"></div>
    </nav>

    <div class="container">
        <header>
            <h1>Hello, I'm a Developer</h1>
            <p>Welcome to my self-contained web project. Everything you see runs from a single HTML file.</p>
            <button class="btn" onclick="incrementCounter()">Click Me</button>
            <div id="counter">Button clicks: 0</div>
        </header>
    </div>

    <script>
        // Set current date
        document.getElementById('date').innerText = new Date().toDateString();

        // Simple counter logic
        let count = 0;
        function incrementCounter() {
            count++;
            document.getElementById('counter').innerText = 'Button clicks: ' + count;
        }
    </script>
</body>
</html>
