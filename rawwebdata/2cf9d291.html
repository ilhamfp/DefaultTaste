<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Personal Portfolio</title>
    <style>
        :root {
            --bg: #f4f4f9;
            --text: #333;
            --accent: #4a90e2;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            padding: 4rem 1rem;
            text-align: center;
        }
        .container {
            max-width: 800px;
            padding: 2rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: opacity 0.3s;
        }
        button:hover {
            opacity: 0.8;
        }
        #message {
            margin-top: 20px;
            font-weight: bold;
            color: var(--accent);
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Site</h1>
        <p>Built with pure HTML, CSS, and JS</p>
    </header>

    <div class="container">
        <h2>About</h2>
        <p>This is a self-contained single-page website. Click the button below to interact with the JavaScript logic.</p>
        <button id="actionBtn">Click for a surprise</button>
        <div id="message"></div>
    </div>

    <script>
        document.getElementById('actionBtn').addEventListener('click', function() {
            const msgDiv = document.getElementById('message');
            const greetings = [
                "Hello, world!",
                "Have a great day!",
                "Keep coding!",
                "JavaScript is running!"
            ];
            const randomMsg = greetings[Math.floor(Math.random() * greetings.length)];
            msgDiv.textContent = randomMsg;
        });
    </script>
</body>
</html>
