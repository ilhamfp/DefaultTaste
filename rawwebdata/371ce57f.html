<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Card Generator</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
            text-align: center;
        }

        .controls {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 40px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 900px;
            width: 100%;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
            min-width: 200px;
            flex: 1;
        }

        label {
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }

        input[type="text"],
        textarea,
        input[type="color"],
        input[type="number"] {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
            width: 100%;
            box-sizing: border-box;
        }

        input[type="text"]:focus,
        textarea:focus,
        input[type="number"]:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            background-color: #3498db;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            margin-top: 10px;
            flex-grow: 1;
        }

        button:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .card-container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            max-width: 1200px;
            width: 100%;
        }

        .card {
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
            width: 300px;
            padding: 25px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .card h2 {
            color: #2c3e50;
            margin-top: 5px;
            margin-bottom: 15px;
            font-size: 1.8rem;
        }

        .card p {
            color: #555;
            line-height: 1.6;
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .card footer {
            margin-top: 15px;
            font-size: 0.9em;
            color: #777;
        }

        .card:nth-child(even) {
            box-shadow: 0 6px 20px rgba(46, 204, 113, 0.2);
        }

        .card:nth-child(odd) {
            box-shadow: 0 6px 20px rgba(230, 126, 34, 0.2);
        }
    </style>
</head>
<body>
    <h1>Dynamic Content Card Generator</h1>

    <div class="controls">
        <div class="input-group">
            <label for="cardTitle">Card Title:</label>
            <input type="text" id="cardTitle" placeholder="Enter card title">
        </div>
        <div class="input-group">
            <label for="cardContent">Card Content:</label>
            <textarea id="cardContent" placeholder="Enter card description or content"></textarea>
        </div>
        <div class="input-group">
            <label for="cardFooter">Card Footer (e.g., date, author):</label>
            <input type="text" id="cardFooter" placeholder="Optional footer text">
        </div>
        <div class="input-group">
            <label for="cardColor">Card Background Color:</label>
            <input type="color" id="cardColor" value="#ffffff">
        </div>
        <div class="input-group">
            <label for="cardTextColor">Card Text Color:</label>
            <input type="color" id="cardTextColor" value="#333333">
        </div>
        <button onclick="createCard()">Create Card</button>
        <button onclick="clearCards()" style="background-color: #e74c3c;">Clear All Cards</button>
    </div>

    <div id="cardGallery" class="card-container">
        <!-- Cards will be generated here -->
    </div>

    <script>
        function createCard() {
            const titleInput = document.getElementById('cardTitle');
            const contentInput = document.getElementById('cardContent');
            const footerInput = document.getElementById('cardFooter');
            const colorInput = document.getElementById('cardColor');
            const textColorInput = document.getElementById('cardTextColor');
            const cardGallery = document.getElementById('cardGallery');

            const title = titleInput.value.trim();
            const content = contentInput.value.trim();
            const footer = footerInput.value.trim();
            const bgColor = colorInput.value;
            const textColor = textColorInput.value;

            if (!title && !content) {
                alert('Please enter at least a title or content for the card.');
                return;
            }

            const card = document.createElement('div');
            card.classList.add('card');
            card.style.backgroundColor = bgColor;
            card.style.color = textColor;

            card.innerHTML = `
                <h2 style="color: ${textColor};">${title || 'Untitled Card'}</h2>
                <p style="color: ${textColor};">${content || 'No content provided.'}</p>
                ${footer ? `<footer style="color: ${textColor};">${footer}</footer>` : ''}
            `;
            // If card color is dark, adjust text color for better contrast automatically.
            const rgb = hexToRgb(bgColor);
            if (rgb) {
                const brightness = (rgb.r * 299 + rgb.g * 587 + rgb.b * 114) / 1000;
                if (brightness < 128) { // If background is dark
                    card.style.color = textColorInput.value === '#333333' ? '#f8f8f8' : textColor; // Only change if default
                    card.querySelector('h2').style.color = textColorInput.value === '#333333' ? '#f8f8f8' : textColor;
                    if (card.querySelector('footer')) {
                        card.querySelector('footer').style.color = textColorInput.value === '#333333' ? '#cccccc' : textColor;
                    }
                }
            }


            cardGallery.appendChild(card);

            // Clear inputs
            titleInput.value = '';
            contentInput.value = '';
            footerInput.value = '';
            colorInput.value = '#ffffff';
            textColorInput.value = '#333333';
        }

        function clearCards() {
            const cardGallery = document.getElementById('cardGallery');
            cardGallery.innerHTML = '';
        }

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        }
    </script>
</body>
</html>
