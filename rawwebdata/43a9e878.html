<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Minimalist Dashboard</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --accent: #38bdf8;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            padding: 2rem;
            text-align: center;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            width: 90%;
            max-width: 1000px;
        }
        .card {
            background: var(--card);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-5px); }
        button {
            background: var(--accent);
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            color: var(--bg);
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        #clock { font-size: 2rem; font-weight: bold; color: var(--accent); }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to Your Dashboard</h1>
        <div id="clock">00:00:00</div>
    </header>

    <main class="container">
        <section class="card">
            <h2>Quick Actions</h2>
            <p>Interact with the counter below to test the browser functionality.</p>
            <button onclick="incrementCount()">Click count: <span id="count">0</span></button>
        </section>

        <section class="card">
            <h2>System Status</h2>
            <p id="status">Everything is running smoothly.</p>
            <button onclick="changeStatus()">Randomize Status</button>
        </section>

        <section class="card">
            <h2>About</h2>
            <p>This is a self-contained HTML file generated dynamically as a single-page application.</p>
        </section>
    </main>

    <script>
        // Clock functionality
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString();
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Increment functionality
        let count = 0;
        function incrementCount() {
            count++;
            document.getElementById('count').textContent = count;
        }

        // Status change functionality
        function changeStatus() {
            const messages = ["System stable.", "Connectivity limited.", "Optimizing background tasks.", "All systems nominal."];
            const randomMsg = messages[Math.floor(Math.random() * messages.length)];
            document.getElementById('status').textContent = randomMsg;
        }
    </script>
</body>
</html>
