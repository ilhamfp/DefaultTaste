<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Interactive Webpage</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f8ff; /* Alice Blue */
            color: #333;
            transition: background-color 0.5s ease;
        }
        .container {
            background-color: #ffffff;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 600px;
            margin: 20px;
            animation: fadeIn 1s ease-out;
        }
        h1 {
            color: #4682b4; /* Steel Blue */
            margin-bottom: 20px;
            animation: slideInFromTop 1s ease-out;
        }
        p {
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .btn {
            background-color: #5cb85c;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 17px;
            transition: background-color 0.3s ease, transform 0.2s ease;
            margin: 5px;
        }
        .btn:hover {
            background-color: #4cae4c;
            transform: translateY(-2px);
        }
        .btn:active {
            transform: translateY(0);
        }
        #messageDisplay {
            margin-top: 30px;
            font-weight: bold;
            color: #2e8b57; /* Sea Green */
            font-size: 1.1em;
        }
        .footer {
            margin-top: 40px;
            font-size: 0.9em;
            color: #666;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideInFromTop {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to My Interactive Webpage!</h1>
        <p>This is a simple demo demonstrating a responsive and interactive webpage using HTML, CSS, and JavaScript, all in one file.</p>
        <p>Click the buttons below to see some basic interactions.</p>
        
        <button class="btn" id="helloBtn">Say Hello</button>
        <button class="btn" id="changeColorBtn">Change Background</button>
        
        <div id="messageDisplay">Click a button!</div>
    </div>

    <div class="footer">
        &copy; <span id="currentYear"></span> My Simple Webpage
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const helloButton = document.getElementById('helloBtn');
            const changeColorButton = document.getElementById('changeColorBtn');
            const messageDisplay = document.getElementById('messageDisplay');
            const body = document.body;
            const currentYearSpan = document.getElementById('currentYear');

            currentYearSpan.textContent = new Date().getFullYear();

            helloButton.addEventListener('click', function() {
                messageDisplay.textContent = 'Hello there! Thanks for clicking.';
                messageDisplay.style.color = '#1e90ff'; /* Dodger Blue */
            });

            changeColorButton.addEventListener('click', function() {
                const colors = ['#f0f8ff', '#ffe4e1', '#e0ffff', '#fffacd', '#f5f5dc']; /* Alice Blue, Misty Rose, Light Cyan, Lemon Chiffon, Beige */
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                body.style.backgroundColor = randomColor;
                messageDisplay.textContent = 'Background color changed!';
                messageDisplay.style.color = '#dc143c'; /* Crimson */
            });
        });
    </script>
</body>
</html>
