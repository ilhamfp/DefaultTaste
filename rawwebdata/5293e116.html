<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Personal Space</title>
    <style>
        :root {
            --bg: #0f172a;
            --text: #f8fafc;
            --accent: #38bdf8;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 2rem;
        }
        h1 { font-size: 3rem; margin-bottom: 0.5rem; }
        p { color: #94a3b8; margin-bottom: 2rem; line-height: 1.6; }
        button {
            background: var(--accent);
            color: var(--bg);
            border: none;
            padding: 0.75rem 1.5rem;
            font-weight: bold;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover { transform: scale(1.05); }
        #status { margin-top: 1.5rem; font-style: italic; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Hello World.</h1>
        <p>This is a self-contained web page built with HTML, CSS, and JS. Click the button below to interact with the DOM.</p>
        <button id="actionBtn">Click for Magic</button>
        <div id="status"></div>
    </div>

    <script>
        const btn = document.getElementById('actionBtn');
        const status = document.getElementById('status');
        
        btn.addEventListener('click', () => {
            const colors = ['#f87171', '#fbbf24', '#34d399', '#818cf8', '#e879f9'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            
            document.body.style.backgroundColor = randomColor;
            status.textContent = 'Background color changed to ' + randomColor;
            btn.textContent = 'Again!';
        });
    </script>
</body>
</html>
