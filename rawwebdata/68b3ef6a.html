<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Portfolio Starter</title>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --text: #f8fafc;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        nav {
            padding: 2rem;
            width: 100%;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
        }
        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        button {
            padding: 1rem 2rem;
            background: var(--primary);
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s;
            margin-top: 2rem;
        }
        button:hover { transform: scale(1.05); }
        #message { margin-top: 20px; font-style: italic; color: #94a3b8; }
    </style>
</head>
<body>

    <nav>DevPortfolio</nav>

    <div class="hero">
        <h1>Welcome to My Website</h1>
        <p>Built with pure HTML, CSS, and JS.</p>
        <button id="actionBtn">Click for Surprise</button>
        <div id="message"></div>
    </div>

    <script>
        const btn = document.getElementById('actionBtn');
        const msg = document.getElementById('message');

        btn.addEventListener('click', () => {
            const colors = ['#f472b6', '#34d399', '#fbbf24', '#60a5fa'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            document.body.style.backgroundColor = randomColor;
            msg.innerText = "Color changed! Refresh to reset.";
        });
    </script>
</body>
</html>
