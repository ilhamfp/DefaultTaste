<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Welcome Page</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            color: #333;
            overflow: hidden;
            position: relative;
        }

        .container {
            background-color: #fff;
            padding: 40px 50px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 600px;
            width: 90%;
            position: relative;
            z-index: 10;
            animation: fadeIn 1.5s ease-out;
        }

        h1 {
            color: #4CAF50;
            margin-bottom: 20px;
            font-size: 2.8em;
            animation: slideInDown 1s ease-out;
        }

        p {
            font-size: 1.2em;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        #name-input {
            padding: 12px 18px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            width: calc(100% - 150px);
            max-width: 300px;
            margin-right: 10px;
            transition: border-color 0.3s ease;
        }

        #name-input:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.2);
        }

        #greet-button {
            padding: 12px 25px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        #greet-button:hover {
            background-color: #45a049;
            transform: translateY(-2px);
        }

        #greet-button:active {
            transform: translateY(0);
        }

        #greeting-output {
            margin-top: 30px;
            font-size: 1.5em;
            color: #333;
            min-height: 1.5em; /* To prevent layout shift */
        }

        .background-element {
            position: absolute;
            background-color: rgba(76, 175, 80, 0.1);
            border-radius: 50%;
            opacity: 0.6;
            animation: float 20s infinite ease-in-out;
            z-index: 1;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideInDown {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes float {
            0% { transform: translate(0, 0); }
            25% { transform: translate(20px, 15px); }
            50% { transform: translate(0, 30px); }
            75% { transform: translate(-20px, 15px); }
            100% { transform: translate(0, 0); }
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 2em;
            }

            p {
                font-size: 1em;
            }

            #name-input {
                width: calc(100% - 130px);
                margin-bottom: 15px;
                margin-right: 0;
            }

            #greet-button {
                width: 100%;
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Our Dynamic Page!</h1>
        <p>Enter your name below and click the button to see a personalized greeting.</p>
        <div>
            <input type="text" id="name-input" placeholder="Your Name">
            <button id="greet-button">Greet Me!</button>
        </div>
        <div id="greeting-output"></div>
    </div>

    <!-- Background elements -->
    <div class="background-element" style="width: 150px; height: 150px; top: 10%; left: 5%; animation-delay: 0s;"></div>
    <div class="background-element" style="width: 100px; height: 100px; bottom: 15%; right: 10%; animation-delay: 5s;"></div>
    <div class="background-element" style="width: 80px; height: 80px; top: 30%; right: 30%; animation-delay: 10s;"></div>
    <div class="background-element" style="width: 120px; height: 120px; bottom: 5%; left: 20%; animation-delay: 15s;"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const nameInput = document.getElementById('name-input');
            const greetButton = document.getElementById('greet-button');
            const greetingOutput = document.getElementById('greeting-output');

            greetButton.addEventListener('click', () => {
                const name = nameInput.value.trim();
                if (name) {
                    greetingOutput.textContent = `Hello, ${name}! Welcome aboard!`;
                    greetingOutput.style.color = '#28a745'; // Green for success
                } else {
                    greetingOutput.textContent = 'Please enter your name.';
                    greetingOutput.style.color = '#dc3545'; // Red for error
                }
            });

            // Optional: allow greeting on Enter key press
            nameInput.addEventListener('keypress', (event) => {
                if (event.key === 'Enter') {
                    greetButton.click();
                }
            });

            // Animate background elements dynamically
            const elements = document.querySelectorAll('.background-element');
            elements.forEach((el, index) => {
                const delay = Math.random() * 20; // 0 to 20 seconds
                const duration = 15 + Math.random() * 10; // 15 to 25 seconds
                const size = 50 + Math.random() * 150; // 50 to 200px
                const top = Math.random() * 80; // 0 to 80%
                const left = Math.random() * 80; // 0 to 80%

                el.style.width = `${size}px`;
                el.style.height = `${size}px`;
                el.style.top = `${top}%`;
                el.style.left = `${left}%`;
                el.style.animationDelay = `${delay}s`;
                el.style.animationDuration = `${duration}s`;
            });
        });
    </script>
</body>
</html>
