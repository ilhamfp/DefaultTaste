<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Portfolio Starter</title>
    <style>
        :root {
            --primary: #6366f1;
            --dark: #1f2937;
            --light: #f3f4f6;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            line-height: 1.6;
            color: var(--dark);
        }

        header {
            background: var(--dark);
            color: white;
            padding: 2rem;
            text-align: center;
        }

        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: opacity 0.3s;
        }

        button:hover {
            opacity: 0.9;
        }

        #message {
            margin-top: 1rem;
            font-weight: bold;
            color: var(--primary);
        }

        .card {
            border: 1px solid #ddd;
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Website</h1>
        <p>Built with pure HTML, CSS, and JS</p>
    </header>

    <div class="container">
        <section class="card">
            <h2>About</h2>
            <p>This is a self-contained web page. You can customize the styles, add new sections, or integrate more complex JavaScript components right here.</p>
            <button id="actionBtn">Click for Magic</button>
            <p id="message"></p>
        </section>

        <section class="card">
            <h2>Features</h2>
            <ul>
                <li>Responsive Design</li>
                <li>Inline Assets</li>
                <li>Clean Structure</li>
            </ul>
        </section>
    </div>

    <script>
        const btn = document.getElementById('actionBtn');
        const message = document.getElementById('message');

        btn.addEventListener('click', () => {
            const colors = ['#6366f1', '#ec4899', '#10b981', '#f59e0b'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            
            message.textContent = "The site theme has been pulsed!";
            document.body.style.borderTop = `10px solid ${randomColor}`;
            
            setTimeout(() => {
                message.textContent = "";
            }, 2000);
        });
    </script>
</body>
</html>
