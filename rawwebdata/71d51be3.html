<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Personal Dashboard</title>
    <style>
        :root {
            --bg: #f4f4f9;
            --card: #ffffff;
            --text: #333;
            --primary: #4a90e2;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: var(--card);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 300px;
        }
        h1 { margin-bottom: 0.5rem; }
        #date { font-weight: bold; color: var(--primary); margin-bottom: 1rem; }
        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        button:hover { opacity: 0.8; }
        #quote { font-style: italic; margin-top: 1.5rem; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="container">
    <h1>Hello!</h1>
    <div id="date"></div>
    <button onclick="updateDate()">Refresh Time</button>
    <div id="quote">"Stay curious and keep coding."</div>
</div>

<script>
    function updateDate() {
        const now = new Date();
        document.getElementById('date').innerText = now.toLocaleDateString() + ' ' + now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    }
    updateDate();
    setInterval(updateDate, 60000);
</script>

</body>
</html>
