<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Minimalist Page</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --text-color: #333;
            --accent-color: #6366f1;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            transition: background 0.5s;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: white;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        h1 { margin-bottom: 1rem; }
        button {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            background-color: var(--accent-color);
            color: white;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s;
        }
        button:hover { transform: scale(1.05); }
        #status { margin-top: 1.5rem; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Hello, World!</h1>
        <p>This is a self-contained web page.</p>
        <button id="actionBtn">Change Background</button>
        <div id="status">Click the button to see magic.</div>
    </div>

    <script>
        const btn = document.getElementById('actionBtn');
        const status = document.getElementById('status');
        
        btn.addEventListener('click', () => {
            const randomColor = '#' + Math.floor(Math.random()*16777215).toString(16);
            document.body.style.backgroundColor = randomColor;
            status.textContent = 'Background color is now: ' + randomColor;
        });
    </script>
</body>
</html>
