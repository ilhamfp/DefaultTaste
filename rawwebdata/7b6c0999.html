<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Portfolio</title>
    <style>
        :root {
            --bg: #f4f4f9;
            --text: #333;
            --accent: #6366f1;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            padding: 4rem 1rem;
            text-align: center;
        }
        section {
            max-width: 800px;
            width: 90%;
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }
        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.05);
        }
        #message {
            margin-top: 1rem;
            font-weight: bold;
            color: var(--accent);
        }
    </style>
</head>
<body>

<header>
    <h1>Welcome to My Space</h1>
    <p>Building clean, functional, and responsive web experiences.</p>
</header>

<section id="about">
    <h2>About Me</h2>
    <p>I am a web developer passionate about crafting intuitive user interfaces. I love experimenting with CSS animations and efficient JavaScript logic.</p>
    <button id="actionBtn">Click for a surprise</button>
    <div id="message"></div>
</section>

<script>
    const btn = document.getElementById('actionBtn');
    const msg = document.getElementById('message');

    btn.addEventListener('click', () => {
        const greetings = [
            "Hello there! Have a great day!",
            "Keep coding and stay curious!",
            "Everything is possible with a few lines of code.",
            "You just interacted with JavaScript!"
        ];
        const randomMsg = greetings[Math.floor(Math.random() * greetings.length)];
        msg.innerText = randomMsg;
    });
</script>

</body>
</html>
