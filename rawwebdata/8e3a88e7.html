<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Welcome Page</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #f06, #48f);
            color: white;
            text-align: center;
            overflow: hidden;
            flex-direction: column;
        }

        .container {
            background-color: rgba(0, 0, 0, 0.7);
            padding: 40px 60px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 800px;
            margin: 20px;
            position: relative;
            animation: fadeIn 1.5s ease-out;
        }

        h1 {
            font-size: 3.5em;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
        }

        p {
            font-size: 1.2em;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .button {
            display: inline-block;
            background-color: #0d6efd;
            color: white;
            padding: 12px 25px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.3s ease, transform 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            border: none;
            cursor: pointer;
            font-size: 1em;
        }

        .button:hover {
            background-color: #0a58ca;
            transform: translateY(-3px);
        }

        .button:active {
            transform: translateY(0);
        }

        #name-input-container {
            margin-top: 20px;
            margin-bottom: 20px;
        }

        #name-input {
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-right: 10px;
            font-size: 1em;
            width: 200px;
            max-width: calc(100% - 150px);
            box-sizing: border-box;
            background-color: rgba(255, 255, 255, 0.9);
            color: #333;
        }

        #name-input::placeholder {
            color: #888;
        }

        .alert-message {
            margin-top: 15px;
            font-style: italic;
            color: #ffda79;
        }

        .footer {
            margin-top: 40px;
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.8);
            position: absolute;
            bottom: 20px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 30px 40px;
            }
            h1 {
                font-size: 2.5em;
            }
            p {
                font-size: 1em;
            }
            .button {
                padding: 10px 20px;
            }
            #name-input {
                width: 150px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px 30px;
            }
            h1 {
                font-size: 2em;
            }
            p {
                font-size: 0.9em;
            }
            .button {
                padding: 8px 15px;
            }
            #name-input {
                width: calc(100% - 120px);
                margin-right: 0;
                margin-bottom: 10px;
            }
            #greet-button {
                display: block;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="welcome-header">Welcome to Our Dynamic Page!</h1>
        <p id="welcome-message">
            We're thrilled to have you here. This is a simple, interactive example of a web page
            built with HTML, CSS, and basic JavaScript. Discover how easily you can create engaging
            experiences.
        </p>

        <div id="name-input-container">
            <input type="text" id="name-input" placeholder="Enter your name">
            <button class="button" id="greet-button">Say Hello</button>
        </div>

        <p class="alert-message" id="greeting-output"></p>

        <a href="#" class="button" onclick="showAlert()">Explore Features</a>
    </div>

    <div class="footer">
        &copy; 2023 Dynamic Web Page | Created with HTML, CSS, and JS
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const nameInput = document.getElementById('name-input');
            const greetButton = document.getElementById('greet-button');
            const greetingOutput = document.getElementById('greeting-output');
            const welcomeHeader = document.getElementById('welcome-header');
            const welcomeMessage = document.getElementById('welcome-message');

            // Check for a saved name in localStorage
            const savedName = localStorage.getItem('userName');
            if (savedName) {
                welcomeHeader.textContent = `Welcome back, ${savedName}!`;
                greetingOutput.textContent = `Nice to see you again, ${savedName}.`;
            }

            greetButton.addEventListener('click', () => {
                const userName = nameInput.value.trim();
                if (userName) {
                    greetingOutput.textContent = `Hello, ${userName}! Glad you're here.`;
                    welcomeHeader.textContent = `Welcome, ${userName}!`;
                    localStorage.setItem('userName', userName); // Save the name
                    nameInput.value = ''; // Clear input field
                } else {
                    greetingOutput.textContent = 'Please enter your name first.';
                }
            });

            // Optional: allow greeting on Enter key press
            nameInput.addEventListener('keypress', (event) => {
                if (event.key === 'Enter') {
                    greetButton.click();
                }
            });
        });

        function showAlert() {
            alert('This is where you would navigate to new features or sections!');
        }
    </script>
</body>
</html>
