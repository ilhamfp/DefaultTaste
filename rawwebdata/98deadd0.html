<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Welcome Page</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            color: #333;
            text-align: center;
            overflow: hidden;
            position: relative;
            background-image: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
        }

        .container {
            background-color: #ffffff;
            padding: 40px 50px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 90%;
            animation: fadeIn 1s ease-out;
            position: relative;
            z-index: 2;
        }

        h1 {
            color: #4CAF50;
            margin-bottom: 20px;
            font-size: 2.8em;
            letter-spacing: 1px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }

        p {
            font-size: 1.2em;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #555;
        }

        #nameInput {
            padding: 12px 18px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1.1em;
            width: calc(100% - 150px);
            max-width: 300px;
            margin-right: 10px;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }

        #nameInput:focus {
            border-color: #4CAF50;
            outline: none;
            box-shadow: 0 0 8px rgba(76, 175, 80, 0.2);
        }

        button {
            padding: 12px 25px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        button:hover {
            background-color: #45a049;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        #greeting {
            margin-top: 30px;
            font-size: 1.8em;
            color: #3f51b5;
            font-weight: bold;
            min-height: 50px;
            transition: all 0.5s ease-out;
            opacity: 0;
            transform: translateY(20px);
        }

        .show {
            opacity: 1 !important;
            transform: translateY(0) !important;
        }

        .footer {
            margin-top: 40px;
            font-size: 0.9em;
            color: #777;
            position: relative;
            z-index: 2;
        }

        /* Background animation */
        .bubble {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            animation: float 10s infinite ease-in-out;
            z-index: 1;
        }

        .bubble:nth-child(1) { width: 60px; height: 60px; left: 10%; bottom: -60px; animation-duration: 12s; animation-delay: 0s; }
        .bubble:nth-child(2) { width: 90px; height: 90px; left: 25%; bottom: -90px; animation-duration: 10s; animation-delay: 2s; }
        .bubble:nth-child(3) { width: 40px; height: 40px; left: 40%; bottom: -40px; animation-duration: 14s; animation-delay: 4s; }
        .bubble:nth-child(4) { width: 70px; height: 70px; left: 60%; bottom: -70px; animation-duration: 11s; animation-delay: 1s; }
        .bubble:nth-child(5) { width: 50px; height: 50px; left: 80%; bottom: -50px; animation-duration: 13s; animation-delay: 3s; }
        .bubble:nth-child(6) { width: 100px; height: 100px; left: 5%; bottom: -100px; animation-duration: 15s; animation-delay: 5s; }
        .bubble:nth-child(7) { width: 80px; height: 80px; left: 70%; bottom: -80px; animation-duration: 9s; animation-delay: 0.5s; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 0.7; }
            50% { transform: translateY(-100vh) rotate(180deg); opacity: 0.5; }
            100% { transform: translateY(-200vh) rotate(360deg); opacity: 0; }
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px;
            }
            h1 {
                font-size: 2em;
            }
            p {
                font-size: 1em;
            }
            #nameInput {
                width: 100%;
                margin-bottom: 15px;
                margin-right: 0;
            }
            button {
                width: 100%;
            }
            #greeting {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>

    <div class="container">
        <h1>Welcome to Our Site!</h1>
        <p>Enter your name below to receive a personalized greeting.</p>
        <div>
            <input type="text" id="nameInput" placeholder="Your Name">
            <button id="greetButton">Greet Me!</button>
        </div>
        <p id="greeting"></p>
        <p class="footer">Created with ❤️ and JavaScript</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const nameInput = document.getElementById('nameInput');
            const greetButton = document.getElementById('greetButton');
            const greetingParagraph = document.getElementById('greeting');

            const defaultNames = ["Explorer", "Friend", "Valued User", "Innovator", "Guest"];

            function getRandomDefaultName() {
                const randomIndex = Math.floor(Math.random() * defaultNames.length);
                return defaultNames[randomIndex];
            }

            const greetUser = () => {
                const name = nameInput.value.trim();
                let message;

                if (name) {
                    message = `Hello, ${name}! Welcome aboard!`;
                } else {
                    const randomName = getRandomDefaultName();
                    message = `Hello, ${randomName}! Welcome aboard!`;
                }
                greetingParagraph.textContent = message;
                greetingParagraph.classList.add('show');

                // Clear the input after greeting
                nameInput.value = '';
            };

            // Event listener for the button click
            greetButton.addEventListener('click', greetUser);

            // Event listener for the 'Enter' key press in the input field
            nameInput.addEventListener('keydown', (event) => {
                if (event.key === 'Enter') {
                    greetUser();
                }
            });

            // Initial focus on the input field
            nameInput.focus();
        });
    </script>
</body>
</html>
