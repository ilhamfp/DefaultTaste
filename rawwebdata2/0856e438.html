<!DOCTYPE html>
<html>
<head>
<title>My Website</title>
<style>
body {
  font-family: sans-serif;
  margin: 0;
  padding: 0;
  background-color: #f0f0f0;
}

header {
  background-color: #333;
  color: white;
  padding: 1em;
  text-align: center;
}

nav {
  background-color: #444;
  padding: 0.5em;
}

nav ul {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  justify-content: center;
}

nav li {
  margin: 0 1em;
}

nav a {
  color: white;
  text-decoration: none;
  padding: 0.5em 1em;
  border-radius: 5px;
}

nav a:hover {
  background-color: #555;
}

main {
  padding: 1em;
  text-align: center;
}
.card {
  background-color: white;
  border-radius: 5px;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
  padding: 1em;
  margin-bottom: 1em;
}

footer {
  background-color: #333;
  color: white;
  text-align: center;
  padding: 1em;
  position: fixed;
  bottom: 0;
  width: 100%;
}
</style>
</head>
<body>

<header>
  <h1>Welcome to My Website</h1>
</header>

<nav>
  <ul>
    <li><a href="#">Home</a></li>
    <li><a href="#">About</a></li>
    <li><a href="#">Services</a></li>
    <li><a href="#">Contact</a></li>
  </ul>
</nav>

<main>
  <div class="card">
    <h2>About Us</h2>
    <p>This is a simple website created using HTML, CSS, and JavaScript. We offer a variety of services...</p>
  </div>

  <div class="card">
    <h2>Our Services</h2>
    <ul>
      <li>Web Design</li>
      <li>Web Development</li>
      <li>SEO Optimization</li>
    </ul>
  </div>

  <button onclick="showAlert()">Click Me</button>

</main>

<footer>
  <p>&copy; 2024 My Website. All rights reserved.</p>
</footer>

<script>
function showAlert() {
  alert("Button Clicked!");
}
</script>

</body>
</html>
