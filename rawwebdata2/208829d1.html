<!DOCTYPE html>
<html>
<head>
<title>My Website</title>
<style>
body {
  font-family: sans-serif;
  margin: 0;
  padding: 0;
  background-color: #f0f0f0;
}

header {
  background-color: #333;
  color: white;
  padding: 1em;
  text-align: center;
}

nav {
  background-color: #444;
  padding: 0.5em;
  text-align: center;
}

nav a {
  color: white;
  text-decoration: none;
  padding: 0.5em 1em;
}

nav a:hover {
  background-color: #555;
}

main {
  padding: 1em;
}

.content-section {
  background-color: white;
  margin-bottom: 1em;
  padding: 1em;
  border-radius: 5px;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
}

footer {
  background-color: #333;
  color: white;
  text-align: center;
  padding: 1em;
  position: fixed;
  bottom: 0;
  width: 100%;
}

#image-container {
    text-align: center;
    margin-bottom: 1em;
}

#myImage {
    max-width: 100%;
    height: auto;
    border-radius: 5px;
}
</style>
</head>
<body>

<header>
  <h1>Welcome to My Website</h1>
</header>

<nav>
  <a href="#">Home</a>
  <a href="#">About</a>
  <a href="#">Services</a>
  <a href="#">Contact</a>
</nav>

<main>
    <div id="image-container">
        <img id="myImage" src="https://via.placeholder.com/600x400" alt="Placeholder Image">
    </div>
  <section class="content-section">
    <h2>About Us</h2>
    <p>This is a sample website created for demonstration purposes.  It features some content and navigation elements.</p>
  </section>

  <section class="content-section">
    <h2>Our Services</h2>
    <ul>
      <li>Web Design</li>
      <li>Web Development</li>
      <li>SEO Optimization</li>
    </ul>
  </section>
</main>

<footer>
  <p>&copy; 2024 My Website. All rights reserved.</p>
</footer>

<script>
    // Optional JavaScript to dynamically change the image source, for example:
    const img = document.getElementById('myImage');
    img.src = "https://picsum.photos/600/400"; // Changed image

    // Add some interactivity: change content on a click
    const aboutSection = document.querySelector('.content-section:nth-child(1)'); //get the "About Us" section.
    aboutSection.addEventListener('click', function() {
        this.innerHTML = "<h2>Clicked!</h2><p>You clicked the about us section.</p>"; //change the content.
    });

</script>

</body>
</html>
