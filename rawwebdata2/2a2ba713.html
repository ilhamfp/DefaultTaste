<!DOCTYPE html>
<html>
<head>
<title>My Website</title>
<style>
body {
  font-family: sans-serif;
  margin: 0;
  padding: 0;
  background-color: #f0f0f0;
}
header {
  background-color: #333;
  color: white;
  padding: 1em;
  text-align: center;
}
nav {
  background-color: #444;
  padding: 0.5em;
}
nav ul {
  list-style: none;
  padding: 0;
  margin: 0;
  text-align: center;
}
nav li {
  display: inline;
  margin: 0 1em;
}
nav a {
  color: white;
  text-decoration: none;
}
main {
  padding: 20px;
}
section {
  margin-bottom: 20px;
  background-color: white;
  padding: 15px;
  border-radius: 5px;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
}
footer {
  background-color: #333;
  color: white;
  text-align: center;
  padding: 1em;
  position: fixed;
  bottom: 0;
  width: 100%;
}
button {
  background-color: #007bff;
  color: white;
  padding: 10px 15px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}
button:hover {
  background-color: #0056b3;
}
</style>
</head>
<body>

<header>
  <h1>Welcome to My Website</h1>
</header>

<nav>
  <ul>
    <li><a href="#">Home</a></li>
    <li><a href="#">About</a></li>
    <li><a href="#">Services</a></li>
    <li><a href="#">Contact</a></li>
  </ul>
</nav>

<main>
  <section>
    <h2>About Us</h2>
    <p>This is a sample website created with HTML, CSS, and JavaScript.</p>
  </section>

  <section>
    <h2>Services</h2>
    <p>We offer a variety of services. Learn more below:</p>
    <button onclick="alert('Service details would go here')">View Services</button>
  </section>

  <section>
    <h2>Contact Us</h2>
    <p>Contact us at example@example.com</p>
  </section>
</main>

<footer>
  <p>&copy; 2024 My Website. All rights reserved.</p>
</footer>

<script>
// JavaScript code (optional)
</script>

</body>
</html>
