<!DOCTYPE html>
<html>
<head>
<title>My Website</title>
<style>
body {
  font-family: sans-serif;
  margin: 0;
  padding: 0;
  background-color: #f0f0f0;
}

header {
  background-color: #333;
  color: white;
  padding: 1em;
  text-align: center;
}

nav {
  background-color: #444;
  padding: 0.5em;
}

nav ul {
  list-style: none;
  padding: 0;
  margin: 0;
  text-align: center;
}

nav li {
  display: inline;
  margin: 0 1em;
}

nav a {
  color: white;
  text-decoration: none;
}

main {
  padding: 1em;
}

section {
  background-color: white;
  margin-bottom: 1em;
  padding: 1em;
  border-radius: 5px;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
}

footer {
  background-color: #333;
  color: white;
  text-align: center;
  padding: 1em;
  position: fixed;
  bottom: 0;
  width: 100%;
}

#image-container {
    text-align: center;
    margin-bottom: 1em;
}

#image-container img {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
}

button {
    background-color: #4CAF50;
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background-color: #3e8e41;
}
</style>
</head>
<body>

<header>
  <h1>Welcome to My Website</h1>
</header>

<nav>
  <ul>
    <li><a href="#">Home</a></li>
    <li><a href="#">About</a></li>
    <li><a href="#">Services</a></li>
    <li><a href="#">Contact</a></li>
  </ul>
</nav>

<main>
  <section>
    <h2>About Us</h2>
    <p>This is a sample website built with HTML, CSS, and JavaScript.</p>
  </section>

  <section>
    <h2>Services</h2>
    <p>We offer a variety of services.  Check them out!</p>
  </section>

  <section id="image-section">
      <h2>Image Gallery</h2>
      <div id="image-container">
            <img src="https://via.placeholder.com/600x400" alt="Placeholder Image">
      </div>
      <button onclick="changeImage()">Change Image</button>
  </section>
</main>

<footer>
  <p>&copy; 2024 My Website. All rights reserved.</p>
</footer>

<script>
  function changeImage() {
    const images = [
      "https://via.placeholder.com/600x400",
      "https://via.placeholder.com/500x300/e91e63/ffffff",
      "https://via.placeholder.com/600x400/9c27b0/ffffff"
    ];

    const img = document.querySelector("#image-container img");
    const randomIndex = Math.floor(Math.random() * images.length);
    img.src = images[randomIndex];
  }
</script>

</body>
</html>
