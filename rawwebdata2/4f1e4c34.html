<!DOCTYPE html>
<html>
<head>
<title>My Website</title>
<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
  background-color: #f4f4f4;
}

header {
  background-color: #333;
  color: white;
  padding: 1em;
  text-align: center;
}

nav {
  background-color: #444;
  padding: 0.5em;
  text-align: center;
}

nav a {
  color: white;
  text-decoration: none;
  padding: 0.5em 1em;
}

nav a:hover {
  background-color: #555;
}

section {
  padding: 20px;
  margin: 10px;
  background-color: white;
  border-radius: 5px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

footer {
  background-color: #333;
  color: white;
  text-align: center;
  padding: 1em;
  position: fixed;
  bottom: 0;
  width: 100%;
}

#image-container {
  display: flex;
  justify-content: center;
  align-items: center;
  margin-bottom: 20px;
}

#image-container img {
  max-width: 100%;
  max-height: 300px;
  border-radius: 5px;
}

button {
  background-color: #4CAF50;
  border: none;
  color: white;
  padding: 10px 20px;
  text-align: center;
  text-decoration: none;
  display: inline-block;
  font-size: 16px;
  margin: 4px 2px;
  cursor: pointer;
  border-radius: 5px;
}
</style>
</head>
<body>

<header>
  <h1>Welcome to My Website</h1>
</header>

<nav>
  <a href="#">Home</a>
  <a href="#">About</a>
  <a href="#">Services</a>
  <a href="#">Contact</a>
</nav>

<section>
  <h2>About Us</h2>
  <p>This is a simple website created using HTML, CSS, and JavaScript. It demonstrates basic web page structure and functionality.</p>
  <div id="image-container">
    <img src="https://via.placeholder.com/400x200" alt="Placeholder Image">
  </div>
  <button onclick="showAlert()">Click Me</button>
</section>

<footer>
  &copy; 2024 My Website. All rights reserved.
</footer>

<script>
function showAlert() {
  alert("Button clicked!");
}
</script>

</body>
</html>
