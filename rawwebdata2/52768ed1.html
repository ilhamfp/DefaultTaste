<!DOCTYPE html>
<html>
<head>
<title>My Website</title>
<style>
body {
  font-family: sans-serif;
  margin: 0;
  padding: 0;
  background-color: #f0f0f0;
}

header {
  background-color: #333;
  color: white;
  padding: 1em;
  text-align: center;
}

nav {
  background-color: #444;
  padding: 0.5em;
}

nav ul {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  justify-content: center;
}

nav li {
  margin: 0 1em;
}

nav a {
  color: white;
  text-decoration: none;
}

main {
  padding: 1em;
  text-align: center;
}

.content-box {
  background-color: white;
  border-radius: 8px;
  padding: 1em;
  margin-bottom: 1em;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
}

footer {
  background-color: #333;
  color: white;
  text-align: center;
  padding: 1em;
  position: fixed;
  bottom: 0;
  width: 100%;
}
</style>
</head>
<body>

<header>
  <h1>Welcome to My Website</h1>
</header>

<nav>
  <ul>
    <li><a href="#">Home</a></li>
    <li><a href="#">About</a></li>
    <li><a href="#">Services</a></li>
    <li><a href="#">Contact</a></li>
  </ul>
</nav>

<main>
  <div class="content-box">
    <h2>About Us</h2>
    <p>This is a sample website.  Learn more below!</p>
    <button onclick="showAlert()">Click Me</button>
  </div>

  <div class="content-box">
    <h2>Services</h2>
    <p>We offer a variety of services...</p>
  </div>

  <div class="content-box">
    <h2>Contact</h2>
    <p>Contact us at...</p>
  </div>
</main>

<footer>
  &copy; 2024 My Website. All rights reserved.
</footer>

<script>
function showAlert() {
  alert("Button Clicked!");
}
</script>

</body>
</html>
