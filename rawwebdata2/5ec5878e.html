<!DOCTYPE html>
<html>
<head>
<title>My Website</title>
<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
  background-color: #f4f4f4;
}

header {
  background-color: #333;
  color: #fff;
  padding: 1em;
  text-align: center;
}

nav {
  background-color: #444;
  padding: 0.5em;
}

nav a {
  color: #fff;
  text-decoration: none;
  padding: 0.5em 1em;
  display: inline-block;
}

nav a:hover {
  background-color: #555;
}

main {
  padding: 1em;
}

section {
  margin-bottom: 1em;
  background-color: #fff;
  padding: 1em;
  border-radius: 5px;
  box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
}

footer {
  background-color: #333;
  color: #fff;
  text-align: center;
  padding: 1em;
  position: fixed;
  bottom: 0;
  width: 100%;
}

#myImage {
  width: 200px;
  border-radius: 10px;
}

#myButton {
  background-color: #4CAF50;
  border: none;
  color: white;
  padding: 15px 32px;
  text-align: center;
  text-decoration: none;
  display: inline-block;
  font-size: 16px;
  margin: 4px 2px;
  cursor: pointer;
  border-radius: 5px;
}
</style>
</head>
<body>

<header>
  <h1>Welcome to My Website</h1>
</header>

<nav>
  <a href="#">Home</a>
  <a href="#">About</a>
  <a href="#">Services</a>
  <a href="#">Contact</a>
</nav>

<main>

  <section>
    <h2>About Us</h2>
    <p>This is a sample website built with HTML, CSS, and JavaScript.  It's a demonstration, nothing more.</p>
    <img src="https://via.placeholder.com/200" id="myImage" alt="Placeholder Image">
  </section>

  <section>
    <h2>Our Services</h2>
    <ul>
      <li>Web Design</li>
      <li>Web Development</li>
      <li>SEO</li>
    </ul>
  </section>

  <section>
    <h2>Contact Us</h2>
    <p>Contact us at example@example.com</p>
    <button id="myButton" onclick="changeImage()">Change Image</button>
  </section>

</main>

<footer>
  <p>&copy; 2024 My Website</p>
</footer>

<script>
function changeImage() {
  var img = document.getElementById("myImage");
  if (img.src.includes("200")) {
    img.src = "https://via.placeholder.com/300";
  } else {
    img.src = "https://via.placeholder.com/200";
  }
}
</script>

</body>
</html>
