<!DOCTYPE html>
<html>
<head>
<title>My Website</title>
<style>
body {
  font-family: sans-serif;
  margin: 0;
  padding: 0;
  background-color: #f4f4f4;
}

header {
  background-color: #333;
  color: #fff;
  padding: 1em 0;
  text-align: center;
}

nav {
  background-color: #444;
  padding: 0.5em 0;
  text-align: center;
}

nav a {
  color: #fff;
  text-decoration: none;
  padding: 0.5em 1em;
}

main {
  padding: 20px;
}

.card {
  background-color: #fff;
  border-radius: 5px;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
  padding: 20px;
  margin-bottom: 20px;
}

footer {
  text-align: center;
  padding: 1em 0;
  background-color: #333;
  color: #fff;
  position: fixed;
  bottom: 0;
  width: 100%;
}

button {
  background-color: #4CAF50;
  color: white;
  padding: 10px 20px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}

button:hover {
  background-color: #3e8e41;
}
</style>
</head>
<body>

<header>
  <h1>Welcome to My Website</h1>
</header>

<nav>
  <a href="#">Home</a>
  <a href="#">About</a>
  <a href="#">Services</a>
  <a href="#">Contact</a>
</nav>

<main>
  <div class="card">
    <h2>About Us</h2>
    <p>This is a sample website built with HTML, CSS, and JavaScript.</p>
  </div>

  <div class="card">
    <h2>Services</h2>
    <p>We offer various services.  More details coming soon.</p>
  </div>

  <div class="card">
    <h2>Contact Us</h2>
    <p>Contact us at example@example.com</p>
  </div>

  <button onclick="showAlert()">Click Me</button>
</main>

<footer>
  <p>&copy; 2024 My Website. All rights reserved.</p>
</footer>

<script>
function showAlert() {
  alert("Button Clicked!");
}
</script>

</body>
</html>
