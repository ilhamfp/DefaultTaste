<!DOCTYPE html>
<html>
<head>
<title>My Website</title>
<style>
body {
  font-family: sans-serif;
  margin: 20px;
  background-color: #f4f4f4;
}
h1 {
  color: #333;
  text-align: center;
}
.container {
  background-color: #fff;
  padding: 20px;
  border-radius: 8px;
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}
p {
  line-height: 1.6;
}
button {
  background-color: #4CAF50;
  color: white;
  padding: 10px 20px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-size: 16px;
}
button:hover {
  background-color: #3e8e41;
}
#counter {
  font-size: 24px;
  margin-top: 10px;
}
</style>
</head>
<body>

<h1>Welcome to My Website</h1>

<div class="container">
  <p>This is a simple website created using HTML, CSS, and JavaScript. You can interact with the button below.</p>
</div>

<div class="container">
  <button id="myButton">Click Me</button>
  <p id="counter">Clicks: 0</p>
</div>

<script>
let count = 0;
const button = document.getElementById('myButton');
const counter = document.getElementById('counter');

button.addEventListener('click', function() {
  count++;
  counter.textContent = 'Clicks: ' + count;
});
</script>

</body>
</html>
