<!DOCTYPE html>
<html>
<head>
<title>My Website</title>
<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
  background-color: #f4f4f4;
}

header {
  background-color: #333;
  color: #fff;
  padding: 1em;
  text-align: center;
}

nav {
  background-color: #444;
  padding: 0.5em;
  text-align: center;
}

nav a {
  color: #fff;
  text-decoration: none;
  padding: 0.5em 1em;
}

nav a:hover {
  background-color: #555;
}

.container {
  padding: 2em;
}

.content {
  background-color: #fff;
  padding: 1em;
  margin-bottom: 1em;
  border-radius: 5px;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
}

footer {
  background-color: #333;
  color: #fff;
  text-align: center;
  padding: 1em;
  position: fixed;
  bottom: 0;
  width: 100%;
}
#dynamicContent {
    margin-top:20px;
}
</style>
</head>
<body>

<header>
  <h1>Welcome to My Website</h1>
</header>

<nav>
  <a href="#" onclick="loadContent('home')">Home</a>
  <a href="#" onclick="loadContent('about')">About</a>
  <a href="#" onclick="loadContent('contact')">Contact</a>
</nav>

<div class="container">
  <div id="dynamicContent" class="content">
    <p>Click on the navigation links above to load content.</p>
  </div>
</div>

<footer>
  <p>&copy; 2024 My Website. All rights reserved.</p>
</footer>

<script>
function loadContent(page) {
  let content = '';

  switch (page) {
    case 'home':
      content = '<h2>Home</h2><p>This is the home page content.</p>';
      break;
    case 'about':
      content = '<h2>About Us</h2><p>Learn more about our company.</p>';
      break;
    case 'contact':
      content = '<h2>Contact Us</h2><p>Get in touch with us.</p>';
      break;
    default:
      content = '<p>Page not found.</p>';
  }

  document.getElementById('dynamicContent').innerHTML = content;
}
</script>

</body>
</html>
