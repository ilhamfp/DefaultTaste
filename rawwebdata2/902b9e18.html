<!DOCTYPE html>
<html>
<head>
<title>My Website</title>
<style>
body {
  font-family: sans-serif;
  margin: 0;
  padding: 0;
  background-color: #f0f0f0;
}

header {
  background-color: #333;
  color: white;
  padding: 1em;
  text-align: center;
}

nav {
  background-color: #444;
  padding: 0.5em;
  text-align: center;
}

nav a {
  color: white;
  text-decoration: none;
  padding: 0.5em 1em;
}

nav a:hover {
  background-color: #555;
}

main {
  padding: 1em;
}

section {
  background-color: white;
  padding: 1em;
  margin-bottom: 1em;
  border-radius: 5px;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
}

footer {
  background-color: #333;
  color: white;
  text-align: center;
  padding: 1em;
  position: fixed;
  bottom: 0;
  width: 100%;
}

#imageContainer {
  text-align: center;
  margin-bottom: 1em;
}

#myImage {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
}
</style>
</head>
<body>

<header>
  <h1>Welcome to My Website</h1>
</header>

<nav>
  <a href="#">Home</a>
  <a href="#">About</a>
  <a href="#">Services</a>
  <a href="#">Contact</a>
</nav>

<main>

  <section>
    <h2>About Us</h2>
    <p>This is a sample website built with HTML, CSS, and JavaScript. It demonstrates basic layout and styling.</p>
  </section>

  <section>
    <h2>Featured Content</h2>
    <div id="imageContainer">
      <img id="myImage" src="https://via.placeholder.com/600x400" alt="Placeholder Image">
    </div>
    <button onclick="changeImage()">Change Image</button>
  </section>

  <section>
    <h2>Contact Us</h2>
    <p>Contact information goes here.</p>
  </section>

</main>

<footer>
  <p>&copy; 2024 My Website. All rights reserved.</p>
</footer>

<script>
function changeImage() {
  const imageUrls = [
    "https://via.placeholder.com/600x400",
    "https://via.placeholder.com/800x600",
    "https://via.placeholder.com/400x300"
  ];
  const randomIndex = Math.floor(Math.random() * imageUrls.length);
  const imageElement = document.getElementById("myImage");
  imageElement.src = imageUrls[randomIndex];
}
</script>

</body>
</html>
