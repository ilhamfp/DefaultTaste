<!DOCTYPE html>
<html>
<head>
<title>My Website</title>
<style>
body {
  font-family: sans-serif;
  margin: 0;
  padding: 0;
  background-color: #f0f0f0;
}

header {
  background-color: #333;
  color: white;
  padding: 1em;
  text-align: center;
}

nav {
  background-color: #444;
  padding: 0.5em;
}

nav a {
  color: white;
  text-decoration: none;
  padding: 0.5em 1em;
  display: inline-block;
}

nav a:hover {
  background-color: #555;
}

main {
  padding: 1em;
}

section {
  margin-bottom: 1em;
  background-color: white;
  padding: 1em;
  border-radius: 5px;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
}

footer {
  background-color: #333;
  color: white;
  text-align: center;
  padding: 1em;
  position: fixed;
  bottom: 0;
  width: 100%;
}

#myImage {
  width: 100%;
  max-width: 500px;
  border-radius: 5px;
  display: block;
  margin: 0 auto;
}
</style>
</head>
<body>

<header>
  <h1>Welcome to My Website</h1>
</header>

<nav>
  <a href="#">Home</a>
  <a href="#">About</a>
  <a href="#">Services</a>
  <a href="#">Contact</a>
</nav>

<main>
  <section>
    <h2>About Us</h2>
    <p>This is a sample website created with HTML, CSS, and JavaScript. It demonstrates basic web page structure and styling.</p>
  </section>

  <section>
    <h2>Image Gallery</h2>
    <img id="myImage" src="https://via.placeholder.com/500" alt="Placeholder Image">
  </section>

  <section>
    <h2>Contact Us</h2>
    <p>You can reach us at contact@example.com.</p>
  </section>

  <button onclick="showAlert()">Click Me</button>
</main>

<footer>
  <p>&copy; 2024 My Website. All rights reserved.</p>
</footer>

<script>
function showAlert() {
  alert("Button Clicked!");
}
</script>

</body>
</html>
