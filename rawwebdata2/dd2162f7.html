<!DOCTYPE html>
<html>
<head>
<title>My Website</title>
<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
  background-color: #f4f4f4;
}

header {
  background-color: #333;
  color: #fff;
  padding: 1em;
  text-align: center;
}

nav {
  background-color: #444;
  padding: 0.5em;
}

nav a {
  color: #fff;
  text-decoration: none;
  padding: 0.5em 1em;
  display: inline-block;
}

nav a:hover {
  background-color: #666;
}

.container {
  padding: 2em;
}

.content {
  background-color: #fff;
  padding: 1em;
  margin-bottom: 1em;
  border-radius: 5px;
  box-shadow: 0 0 5px rgba(0,0,0,0.1);
}

footer {
  background-color: #333;
  color: #fff;
  text-align: center;
  padding: 1em;
  position: fixed;
  bottom: 0;
  width: 100%;
}

#imageContainer {
    text-align: center;
    margin-bottom: 1em;
}

img {
    max-width: 100%;
    height: auto;
}
</style>
</head>
<body>

<header>
  <h1>Welcome to My Website</h1>
</header>

<nav>
  <a href="#">Home</a>
  <a href="#">About</a>
  <a href="#">Services</a>
  <a href="#">Contact</a>
</nav>

<div class="container">
  <div class="content">
    <h2>Welcome!</h2>
    <p>This is a simple website created with HTML, CSS, and JavaScript.</p>
  </div>

  <div class="content" id="imageContainer">
      <h2>Featured Image</h2>
      <img src="https://via.placeholder.com/600x400" alt="Placeholder Image">
  </div>

  <div class="content">
    <h2>More Information</h2>
    <p>You can add more content here, like text, images, and links.</p>
  </div>
</div>

<footer>
  <p>&copy; 2024 My Website. All rights reserved.</p>
</footer>

<script>
// JavaScript code can go here
</script>

</body>
</html>
