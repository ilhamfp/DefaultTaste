<!DOCTYPE html>
<html>
<head>
<title>My Awesome Website</title>
<style>
body {
  font-family: sans-serif;
  margin: 0;
  padding: 0;
  background-color: #f4f4f4;
}

header {
  background-color: #333;
  color: #fff;
  padding: 1em;
  text-align: center;
}

nav {
  background-color: #444;
  color: #fff;
  padding: 0.5em;
  text-align: center;
}

nav a {
  color: #fff;
  text-decoration: none;
  padding: 0.5em 1em;
}

nav a:hover {
  background-color: #555;
}

main {
  padding: 1em;
}

.card {
  background-color: #fff;
  border-radius: 5px;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
  padding: 1em;
  margin-bottom: 1em;
}

button {
  background-color: #007bff;
  color: #fff;
  border: none;
  padding: 0.5em 1em;
  border-radius: 3px;
  cursor: pointer;
}

button:hover {
  background-color: #0056b3;
}

#image-container {
  text-align: center;
  margin-bottom: 1em;
}

#dynamic-content {
  margin-top: 1em;
  padding: 1em;
  border: 1px solid #ccc;
  border-radius: 5px;
}
</style>
</head>
<body>

<header>
  <h1>Welcome to My Website</h1>
</header>

<nav>
  <a href="#">Home</a>
  <a href="#">About</a>
  <a href="#">Services</a>
  <a href="#">Contact</a>
</nav>

<main>
  <div class="card">
    <h2>About Us</h2>
    <p>This is a sample website.  We provide excellent services and amazing content.</p>
  </div>

  <div class="card">
    <h2>Featured Content</h2>
    <p>Check out our latest news and updates.</p>
  </div>

  <div id="image-container">
    <img src="https://via.placeholder.com/300" alt="Placeholder Image">
  </div>

  <button onclick="changeContent()">Change Content</button>

  <div id="dynamic-content">
    <p>Initial Content</p>
  </div>

</main>

<footer>
  <p style="text-align: center; padding: 1em; background-color: #333; color: #fff;">&copy; 2024 My Website</p>
</footer>

<script>
function changeContent() {
  const contentDiv = document.getElementById('dynamic-content');
  contentDiv.innerHTML = "<p>Content changed by JavaScript!</p>";
}
</script>

</body>
</html>
